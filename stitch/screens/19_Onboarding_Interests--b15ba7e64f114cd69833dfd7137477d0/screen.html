<script>
  document.addEventListener('DOMContentLoaded', () => {
    const chips = document.querySelectorAll('.interest-chip');
    const continueBtn = document.getElementById('continue-btn');
    let selectedCount = 0;

    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const isSelected = chip.getAttribute('data-selected') === 'true';
        
        if (isSelected) {
          // Deselect
          chip.setAttribute('data-selected', 'false');
          chip.classList.remove('bg-primary-fixed', 'text-on-primary-fixed', 'ring-1', 'ring-primary/20');
          chip.classList.add('bg-surface-container', 'text-on-surface');
          chip.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
          selectedCount--;
        } else {
          // Select
          chip.setAttribute('data-selected', 'true');
          chip.classList.remove('bg-surface-container', 'text-on-surface');
          chip.classList.add('bg-primary-fixed', 'text-on-primary-fixed', 'ring-1', 'ring-primary/20');
          chip.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
          
          // Add a little pop animation
          chip.style.transform = 'scale(0.95)';
          setTimeout(() => {
            chip.style.transform = 'scale(1)';
          }, 150);

          selectedCount++;
        }

        // Update button state
        if (selectedCount > 0) {
          continueBtn.removeAttribute('disabled');
          continueBtn.classList.remove('opacity-50');
        } else {
          continueBtn.setAttribute('disabled', 'true');
          continueBtn.classList.add('opacity-50');
        }
      });
    });
    
    // Initial button state
    continueBtn.classList.add('opacity-50');
  });
</script></main></body></html>
