<script>
  document.addEventListener('DOMContentLoaded', () => {
    const chips = document.querySelectorAll('.chip-btn');
    
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const isSelected = chip.getAttribute('data-selected') === 'true';
        chip.setAttribute('data-selected', !isSelected);
        
        if (!isSelected) {
          // Select
          chip.classList.remove('bg-surface-container-high', 'text-on-surface');
          chip.classList.add('bg-secondary-container', 'text-on-secondary-container', 'shadow-sm');
          
          // Add checkmark optionally or animate icon if desired, keeping simple here
          chip.style.transform = 'scale(0.95)';
          setTimeout(() => chip.style.transform = 'scale(1)', 100);
        } else {
          // Deselect
          chip.classList.add('bg-surface-container-high', 'text-on-surface');
          chip.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'shadow-sm');
        }
      });
    });
  });
