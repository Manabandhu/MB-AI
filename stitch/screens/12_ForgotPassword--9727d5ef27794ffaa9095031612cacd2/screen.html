<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface": "#faf8ff", "outline": "#797586", "surface-container-high": "#e2e7ff", "surface-bright": "#faf8ff", "on-primary-fixed": "#1a0063", "surface-tint": "#5e42d9", "on-tertiary-fixed-variant": "#743500", "primary": "#431ebe", "on-tertiary": "#ffffff", "background": "#faf8ff", "surface-variant": "#dae2fd", "on-secondary": "#ffffff", "on-secondary-fixed": "#002020", "outline-variant": "#c9c4d7", "inverse-on-surface": "#eef0ff", "error-container": "#ffdad6", "secondary": "#00696b", "primary-container": "#5b3fd6", "on-secondary-fixed-variant": "#004f51", "surface-container-highest": "#dae2fd", "surface-container-lowest": "#ffffff", "on-primary-fixed-variant": "#4522c0", "primary-fixed-dim": "#c9bfff", "tertiary": "#703300", "error": "#ba1a1a", "on-tertiary-fixed": "#311300", "on-primary": "#ffffff", "on-background": "#131b2e", "surface-container-low": "#f2f3ff", "on-error": "#ffffff", "tertiary-fixed-dim": "#ffb689", "tertiary-fixed": "#ffdbc8", "on-secondary-container": "#007072", "inverse-primary": "#c9bfff", "surface-container": "#eaedff", "secondary-container": "#8ff3f4", "secondary-fixed": "#8ff3f4", "tertiary-container": "#944600", "on-primary-container": "#d7cfff", "surface-dim": "#d2d9f4", "on-surface": "#131b2e", "secondary-fixed-dim": "#72d6d8", "on-surface-variant": "#484554", "primary-fixed": "#e5deff", "on-tertiary-container": "#ffcaaa", "inverse-surface": "#283044", "on-error-container": "#93000a" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "margin-tablet": "24px", "unit": "8px", "base": "4px", "margin-mobile": "16px", "stack-sm": "8px", "stack-lg": "24px", "gutter": "16px", "stack-md": "16px" }, "fontFamily": { "headline-lg": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"], "headline-md": ["Inter"], "label-md": ["Inter"], "body-sm": ["Inter"], "display": ["Inter"], "body-md": ["Inter"], "headline-lg-mobile": ["Inter"] }, "fontSize": { "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.022em", "fontWeight": "700" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }] } } } };</script><style>@layer base { body { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } }</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface text-on-surface font-body-md selection:bg-primary-fixed-dim"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 flex items-center px-margin-mobile gap-stack-md"><button aria-label="Back" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-on-surface text-[24px]">arrow_back</span></button><img alt="ManaBandhu logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLs0M1VGWNL3Xb3bF48xlOO2okf2eA24_UPS48maqbG97LuRBxmy4MWa1EtNlhOccVHifqVSUVIZMEU8-z8rsfgeyO65DQnP88qQz663DzrUX5es6RnPDkfASjguVcvCdVPEuRyVOuxZ4LzuBAmnL56HffFOvvkN2RrEaQhGap8pFXIfd0PjH3E596K6DQ8MhlhExd20h3bM-ZC8fNpNcwXcNxyHpAQr2WRcOw-EuyZ0y25eWiUrN-9RUg"/><h1 class="font-headline-md text-headline-md text-on-surface truncate">Forgot Password</h1><div class="ml-auto"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="pt-16 min-h-screen bg-surface"><div class="flex flex-col w-full px-margin-mobile py-stack-lg gap-stack-lg">
<!-- Decorative Header Illustration -->
<div class="w-full flex justify-center py-stack-sm">
<div class="relative w-32 h-32 flex items-center justify-center">
<!-- Animated background glow -->
<div class="absolute inset-0 bg-primary-fixed rounded-full blur-xl opacity-60 animate-pulse"></div>
<!-- Soft shape background -->
<div class="absolute inset-4 bg-surface-container-high rounded-[2rem] rotate-45 shadow-sm"></div>
<!-- Icon -->
<span class="material-symbols-outlined relative text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">
        lock_reset
      </span>
</div>
</div>
<!-- Header -->
<div class="flex flex-col gap-stack-sm text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Forgot Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
      Enter your email or phone number and we'll send you a code to reset your password.
    </p>
</div>
<!-- Form Section -->
<div class="flex flex-col gap-stack-md mt-stack-sm">
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface ml-1" for="recovery-input">Email or phone</label>
<div class="relative group">
<input autocomplete="username" class="w-full bg-surface-container-lowest shadow-[inset_0_0_0_1px_theme(colors.outline-variant)] focus:shadow-[inset_0_0_0_2px_theme(colors.primary)] rounded-lg px-4 py-4 font-body-md text-body-md text-on-surface outline-none transition-shadow peer" id="recovery-input" placeholder="e.g., name@example.com" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant peer-focus:text-primary transition-colors" id="input-icon">
          mail
        </span>
</div>
<div class="flex items-center gap-1 mt-1 hidden" id="error-message">
<span class="material-symbols-outlined text-[16px] text-error">error</span>
<p class="font-body-sm text-body-sm text-error">Please enter a valid email or phone number.</p>
</div>
</div>
<button class="w-full bg-primary text-on-primary rounded-lg py-4 font-label-md text-label-md shadow-md flex justify-center items-center gap-2 transition-all active:scale-[0.98] mt-2 relative overflow-hidden" id="submit-btn">
<!-- Loading spinner (hidden by default) -->
<span class="material-symbols-outlined text-[20px] animate-spin hidden absolute" id="loading-spinner">progress_activity</span>
<span class="transition-opacity duration-200" id="btn-text">Send recovery code</span>
<span class="material-symbols-outlined text-[18px] transition-transform duration-300 group-hover:translate-x-1" id="btn-icon">arrow_forward</span>
</button>
</div>
<!-- Footer Links -->
<div class="flex flex-col items-center gap-stack-md mt-auto pt-stack-lg">
<a class="font-label-md text-label-md text-primary flex items-center gap-1 active:opacity-70 transition-opacity" href="javascript:history.back()">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
      Back to sign in
    </a>
<div class="bg-surface-container-low px-4 py-3 rounded-xl w-full flex items-center justify-between shadow-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant">Having trouble?</p>
<a class="font-label-md text-label-md text-primary active:opacity-70 transition-opacity" href="#">Contact support</a>
</div>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('recovery-input');
    const icon = document.getElementById('input-icon');
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');
    const spinner = document.getElementById('loading-spinner');
    const errorMsg = document.getElementById('error-message');

    // Dynamic icon based on input content (email vs phone)
    input.addEventListener('input', (e) => {
      const val = e.target.value;
      if (val.includes('@')) {
        icon.textContent = 'mail';
      } else if (/\d/.test(val) && !/[a-zA-Z]/.test(val)) {
        icon.textContent = 'smartphone';
      } else {
        icon.textContent = 'badge';
      }
      
      // Clear error on type
      if (!errorMsg.classList.contains('hidden')) {
        clearError();
      }
    });

    function showError() {
      input.classList.remove('shadow-[inset_0_0_0_1px_theme(colors.outline-variant)]', 'focus:shadow-[inset_0_0_0_2px_theme(colors.primary)]');
      input.classList.add('shadow-[inset_0_0_0_2px_theme(colors.error)]', 'bg-error-container', 'text-on-error-container');
      icon.classList.remove('text-outline-variant', 'peer-focus:text-primary');
      icon.classList.add('text-error');
      errorMsg.classList.remove('hidden');
      
      // Shake animation
      input.parentElement.animate([
        { transform: 'translateX(0)' },
        { transform: 'translateX(-4px)' },
        { transform: 'translateX(4px)' },
        { transform: 'translateX(-4px)' },
        { transform: 'translateX(4px)' },
        { transform: 'translateX(0)' }
      ], { duration: 400, easing: 'ease-in-out' });
    }

    function clearError() {
      input.classList.add('shadow-[inset_0_0_0_1px_theme(colors.outline-variant)]', 'focus:shadow-[inset_0_0_0_2px_theme(colors.primary)]');
      input.classList.remove('shadow-[inset_0_0_0_2px_theme(colors.error)]', 'bg-error-container', 'text-on-error-container');
      icon.classList.add('text-outline-variant', 'peer-focus:text-primary');
      icon.classList.remove('text-error');
      errorMsg.classList.add('hidden');
    }

    btn.addEventListener('click', () => {
      const val = input.value.trim();
      
      // Simple validation: must not be empty, must look vaguely like email or phone
      const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
      const isPhone = /^[\d\+\-\s\(\)]{7,15}$/.test(val);

      if (!val || (!isEmail && !isPhone)) {
        showError();
        return;
      }

      // Simulate loading state
      btnText.style.opacity = '0';
      btnIcon.style.opacity = '0';
      
      setTimeout(() => {
        spinner.classList.remove('hidden');
      }, 200);

      btn.classList.add('pointer-events-none');

      // Simulate network request
      setTimeout(() => {
        spinner.classList.add('hidden');
        btnText.textContent = 'Code Sent!';
        btnIcon.textContent = 'check_circle';
        btnText.style.opacity = '1';
        btnIcon.style.opacity = '1';
        btn.classList.replace('bg-primary', 'bg-secondary');
        btn.classList.replace('text-on-primary', 'text-on-secondary');
      }, 1500);
    });
  });
</script></main></body></html>
