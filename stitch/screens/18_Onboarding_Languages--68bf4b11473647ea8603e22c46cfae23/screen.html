<div class="flex flex-col gap-unit mb-stack-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Preferred Languages</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Which languages do you prefer to use?</p>
</div>
</div>
<div class="px-margin-mobile flex-1 overflow-y-auto pb-32">
<div class="grid grid-cols-2 gap-unit" id="language-grid">
<!-- Generated via JS for cleaner code -->
</div>
</div>
<div class="fixed bottom-0 left-0 right-0 p-margin-mobile bg-surface/90 backdrop-blur-md shadow-[0_-4px_16px_rgba(0,0,0,0.05)]">
<button class="w-full h-12 bg-primary text-on-primary rounded-lg font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-primary/90 transition-colors active:scale-[0.98] relative overflow-hidden group">
<div class="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700 ease-in-out"></div>
<span>Complete</span>
<span class="material-symbols-outlined text-[20px]">check_circle</span>
</button>
</div>
</div>
<script>
  const languages = [
    { id: 'en', label: 'English', selected: true },
    { id: 'te', label: 'Telugu', selected: false },
    { id: 'hi', label: 'Hindi', selected: false },
    { id: 'ta', label: 'Tamil', selected: false },
    { id: 'kn', label: 'Kannada', selected: false },
    { id: 'ml', label: 'Malayalam', selected: false },
    { id: 'bn', label: 'Bengali', selected: false },
    { id: 'gu', label: 'Gujarati', selected: false },
    { id: 'mr', label: 'Marathi', selected: false },
    { id: 'pa', label: 'Punjabi', selected: false },
    { id: 'ur', label: 'Urdu', selected: false },
    { id: 'other', label: 'Other', selected: false }
  ];

  const grid = document.getElementById('language-grid');

  function renderLanguages() {
    grid.innerHTML = languages.map(lang => `
      <label class="relative flex items-center justify-between p-stack-sm rounded-lg min-h-[56px] cursor-pointer transition-all duration-200 ${
        lang.selected 
          ? 'bg-primary-container text-on-primary-container shadow-sm ring-2 ring-primary ring-inset' 
          : 'bg-surface-container-low text-on-surface hover:bg-surface-container'
      }" onclick="toggleLanguage('${lang.id}')">
        <span class="font-label-md text-label-md ml-unit">${lang.label}</span>
        <div class="h-6 w-6 rounded-full flex items-center justify-center transition-colors ${
          lang.selected ? 'bg-primary text-on-primary' : 'bg-surface-variant text-on-surface-variant'
        }">
          ${lang.selected ? '<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: \'FILL\' 1;">check</span>' : ''}
        </div>
      </label>
    `).join('');
  }

  function toggleLanguage(id) {
    const lang = languages.find(l => l.id === id);
    if (lang) {
      lang.selected = !lang.selected;
      renderLanguages();
    }
  }

  // Prevent default label click behavior since we handle it in JS
  grid.addEventListener('click', (e) => {
    if(e.target.tagName.toLowerCase() === 'label' || e.target.closest('label')) {
      e.preventDefault();
    }
  });

  renderLanguages();
</script></main></body></html>
