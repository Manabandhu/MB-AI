  </head><body class="bg-surface text-on-surface font-body-md selection:bg-primary-fixed-dim"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 flex items-center px-margin-mobile gap-stack-md"><button aria-label="Back" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-on-surface text-[24px]">arrow_back</span></button><img alt="ManaBandhu logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLs0M1VGWNL3Xb3bF48xlOO2okf2eA24_UPS48maqbG97LuRBxmy4MWa1EtNlhOccVHifqVSUVIZMEU8-z8rsfgeyO65DQnP88qQz663DzrUX5es6RnPDkfASjguVcvCdVPEuRyVOuxZ4LzuBAmnL56HffFOvvkN2RrEaQhGap8pFXIfd0PjH3E596K6DQ8MhlhExd20h3bM-ZC8fNpNcwXcNxyHpAQr2WRcOw-EuyZ0y25eWiUrN-9RUg"/><h1 class="font-headline-md text-headline-md text-on-surface truncate">Verification Code</h1><div class="ml-auto"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="pt-16 min-h-screen bg-surface"><div class="flex flex-col w-full h-full px-margin-mobile py-stack-lg animate-[fadeIn_0.3s_ease-out]">
<div class="flex flex-col items-center text-center mt-stack-lg mb-stack-lg">
<div class="w-16 h-16 bg-surface-container rounded-full flex items-center justify-center mb-stack-md">
<span class="material-symbols-outlined text-primary text-display">shield_lock</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm">Verify Your Identity</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">Enter the 6-digit code we sent to your device.</p>
</div>
<div class="flex flex-col gap-stack-lg mb-stack-lg relative">
<form class="flex flex-col gap-stack-lg" id="otp-form">
<div class="flex justify-between gap-unit">
<input aria-label="Digit 1" autofocus="" class="w-12 h-14 bg-surface-container rounded-lg text-center font-headline-md text-headline-md text-on-surface outline-none focus:bg-surface-variant transition-colors otp-input border border-transparent focus:border-primary" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="tel"/>
<input aria-label="Digit 2" class="w-12 h-14 bg-surface-container rounded-lg text-center font-headline-md text-headline-md text-on-surface outline-none focus:bg-surface-variant transition-colors otp-input border border-transparent focus:border-primary" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="tel"/>
<input aria-label="Digit 3" class="w-12 h-14 bg-surface-container rounded-lg text-center font-headline-md text-headline-md text-on-surface outline-none focus:bg-surface-variant transition-colors otp-input border border-transparent focus:border-primary" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="tel"/>
<input aria-label="Digit 4" class="w-12 h-14 bg-surface-container rounded-lg text-center font-headline-md text-headline-md text-on-surface outline-none focus:bg-surface-variant transition-colors otp-input border border-transparent focus:border-primary" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="tel"/>
<input aria-label="Digit 5" class="w-12 h-14 bg-surface-container rounded-lg text-center font-headline-md text-headline-md text-on-surface outline-none focus:bg-surface-variant transition-colors otp-input border border-transparent focus:border-primary" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="tel"/>
<input aria-label="Digit 6" class="w-12 h-14 bg-surface-container rounded-lg text-center font-headline-md text-headline-md text-on-surface outline-none focus:bg-surface-variant transition-colors otp-input border border-transparent focus:border-primary" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="tel"/>
</div>
<p class="font-label-sm text-label-sm text-error text-center hidden -mt-stack-sm" id="error-message">Invalid code. Please try again.</p>
<button class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-full flex items-center justify-center hover:bg-primary-container transition-colors disabled:opacity-50 disabled:cursor-not-allowed" id="verify-btn" type="submit">
                Verify
            </button>
</form>
</div>
<div class="flex flex-col items-center gap-stack-md mt-auto mb-stack-lg">
<div class="flex items-center gap-unit text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">Didn't receive code?</p>
<button class="font-label-md text-label-md text-outline disabled:text-outline-variant disabled:pointer-events-none transition-colors" disabled="" id="resend-btn">
                Resend in <span id="timer">00:55</span>
</button>
</div>
<button class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors">
            Change phone or email
        </button>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const inputs = document.querySelectorAll('.otp-input');
        const form = document.getElementById('otp-form');
        const verifyBtn = document.getElementById('verify-btn');
        const errorMsg = document.getElementById('error-message');
        const resendBtn = document.getElementById('resend-btn');
        const timerSpan = document.getElementById('timer');
        
        let timeLeft = 55;
        let timerId;

        
        const startTimer = () => {
            resendBtn.disabled = true;
            resendBtn.classList.replace('text-primary', 'text-outline');
            
            timerId = setInterval(() => {
                timeLeft--;
                const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                timerSpan.textContent = `00:${seconds}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    timerSpan.textContent = '';
                    resendBtn.innerHTML = 'Resend code';
                    resendBtn.disabled = false;
                    resendBtn.classList.replace('text-outline', 'text-primary');
                }
            }, 1000);
        };

        startTimer();

        
        resendBtn.addEventListener('click', () => {
            if (timeLeft <= 0) {
                
                timeLeft = 55;
                resendBtn.innerHTML = 'Resend in <span id="timer">00:55</span>';
                startTimer();
                
                errorMsg.classList.add('hidden');
                inputs.forEach(input => {
                    input.value = '';
                    input.classList.remove('border-error');
                    input.classList.add('border-transparent');
                });
                inputs[0].focus();
            }
        });

        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                
                errorMsg.classList.add('hidden');
                inputs.forEach(inp => {
                    inp.classList.remove('border-error');
                    inp.classList.add('border-transparent');
                });

                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                
                if (e.target.value !== '' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
                if (pastedData) {
                    pastedData.split('').forEach((char, i) => {
                        if (i < inputs.length) {
                            inputs[i].value = char;
                            if (i < inputs.length - 1) inputs[i + 1].focus();
                        }
                    });
                }
            });
        });

        
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const code = Array.from(inputs).map(i => i.value).join('');
            
            if (code.length === 6) {
                
                verifyBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
                verifyBtn.disabled = true;

                
                setTimeout(() => {
                    verifyBtn.innerHTML = 'Verify';
                    verifyBtn.disabled = false;
                    
                    
                    if (code !== '123456') { 
                        errorMsg.classList.remove('hidden');
                        inputs.forEach(input => {
                            input.classList.remove('border-transparent', 'focus:border-primary');
                            input.classList.add('border-error');
                        });
                        inputs[0].focus();
                    } else {
                        
                        alert('Verified!');
                    }
                }, 1500);
            }
        });
    });
</script>
<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style></main></body></html>
