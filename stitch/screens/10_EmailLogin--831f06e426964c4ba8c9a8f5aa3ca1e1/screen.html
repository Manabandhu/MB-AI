<div class="absolute top-[-20%] left-[-10%] w-[140%] h-[140%] -z-10 pointer-events-none opacity-40">
<svg class="animate-slow-spin origin-center" height="100%" preserveaspectratio="xMidYMid slice" viewbox="0 0 1000 1000" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialgradient cx="50%" cy="50%" fx="50%" fy="50%" id="grad1" r="50%">
<stop offset="0%" stop-color="#primary-fixed-dim" stop-opacity="0.2"></stop>
<stop offset="100%" stop-color="transparent" stop-opacity="0"></stop>
</radialgradient>
<radialgradient cx="30%" cy="70%" fx="30%" fy="70%" id="grad2" r="60%">
<stop offset="0%" stop-color="#secondary-fixed" stop-opacity="0.15"></stop>
<stop offset="100%" stop-color="transparent" stop-opacity="0"></stop>
</radialgradient>
</defs>
<circle class="animate-pulse-slow" cx="500" cy="500" fill="url(#grad1)" r="400"></circle>
<circle class="animate-float" cx="200" cy="800" fill="url(#grad2)" r="500"></circle>
</svg>
</div>
<div class="flex flex-col items-center mb-stack-lg animate-fade-in-up">
<div class="w-16 h-16 rounded-2xl bg-surface-container shadow-md flex items-center justify-center p-2 mb-stack-sm transform hover:scale-105 transition-transform duration-300">
<img alt="ManaBandhu Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLs0M1VGWNL3Xb3bF48xlOO2okf2eA24_UPS48maqbG97LuRBxmy4MWa1EtNlhOccVHifqVSUVIZMEU8-z8rsfgeyO65DQnP88qQz663DzrUX5es6RnPDkfASjguVcvCdVPEuRyVOuxZ4LzuBAmnL56HffFOvvkN2RrEaQhGap8pFXIfd0PjH3E596K6DQ8MhlhExd20h3bM-ZC8fNpNcwXcNxyHpAQr2WRcOw-EuyZ0y25eWiUrN-9RUg"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background text-center mt-stack-sm mb-base">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-[280px]">Enter your email address to continue connecting.</p>
</div>
<div class="flex-1 w-full flex flex-col gap-stack-md max-w-md mx-auto animate-fade-in-up delay-100">
<form class="flex flex-col gap-stack-lg" id="loginForm" novalidate="">
<div class="relative group">
<label class="absolute left-3 -top-2.5 px-1 bg-background font-label-sm text-label-sm text-on-surface-variant transition-all duration-200 z-10 group-focus-within:text-primary" for="emailInput">Email address</label>
<input class="w-full h-14 px-gutter bg-surface-container-lowest rounded-xl font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary shadow-sm transition-all duration-200 peer" id="emailInput" name="email" placeholder="you@example.com" required="" type="email"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant peer-focus:text-primary transition-colors duration-200 pointer-events-none">mail</span>
<div class="hidden absolute -bottom-6 left-1 flex items-center gap-1 text-error text-label-sm font-label-sm animate-shake" id="emailError">
<span class="material-symbols-outlined text-[14px]">error</span>
            Please enter a valid email address.
        </div>
</div>
<button class="w-full h-14 bg-primary text-on-primary font-label-md text-label-md rounded-full shadow-md hover:shadow-lg active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 overflow-hidden relative" id="submitBtn" type="submit">
<span class="relative z-10 flex items-center gap-2">
            Continue
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</span>
<div class="absolute inset-0 bg-white/20 translate-y-full hover:translate-y-0 transition-transform duration-300 rounded-full pointer-events-none"></div>
</button>
</form>
<div class="flex flex-col items-center gap-stack-sm mt-stack-md animate-fade-in-up delay-200">
<button class="font-label-md text-label-md text-secondary hover:text-secondary-fixed-dim transition-colors py-2 px-4 rounded-full hover:bg-secondary/5" type="button">
        Use password instead
      </button>
<button class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors py-2 px-4 rounded-full hover:bg-surface-variant/50" type="button">
        Forgot password?
      </button>
</div>
</div>
</div>
<style>
    @keyframes slow-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    .animate-slow-spin {
        animation: slow-spin 40s linear infinite;
    }
    @keyframes float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-20px) scale(1.05); }
    }
    .animate-float {
        animation: float 8s ease-in-out infinite;
    }
    @keyframes pulse-slow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.1); }
    }
    .animate-pulse-slow {
        animation: pulse-slow 6s ease-in-out infinite;
    }
    @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
        animation: fade-in-up 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .delay-100 { animation-delay: 100ms; }
    .delay-200 { animation-delay: 200ms; }
    
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
    }
    .animate-shake {
        animation: shake 0.3s ease-in-out;
    }
    
    /* Autofill styling fix for Chrome */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active{
        -webkit-box-shadow: 0 0 0 30px #ffffff inset !important;
        -webkit-text-fill-color: #131b2e !important;
        border-radius: 0.75rem;
    }
</style>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('emailInput');
    const emailError = document.getElementById('emailError');
    const submitBtn = document.getElementById('submitBtn');

    const validateEmail = (email) => {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(String(email).toLowerCase());
    };

    const showError = () => {
        emailInput.classList.remove('ring-primary');
        emailInput.classList.add('ring-2', 'ring-error');
        emailError.classList.remove('hidden');
        emailError.classList.add('animate-shake');
        
        // Remove animation class after it plays so it can play again
        setTimeout(() => {
            emailError.classList.remove('animate-shake');
        }, 300);
    };

    const hideError = () => {
        emailInput.classList.remove('ring-2', 'ring-error');
        emailError.classList.add('hidden');
    };

    emailInput.addEventListener('input', () => {
        if (!emailError.classList.contains('hidden')) {
            if (validateEmail(emailInput.value) || emailInput.value === '') {
                hideError();
            }
        }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      
      if (!validateEmail(email)) {
        showError();
        return;
      }
      
      // Simulate loading state
      const originalContent = submitBtn.innerHTML;
      submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
      submitBtn.classList.add('opacity-80', 'pointer-events-none');
      
      setTimeout(() => {
          // Reset for demo purposes
          submitBtn.innerHTML = originalContent;
          submitBtn.classList.remove('opacity-80', 'pointer-events-none');
          console.log('Login attempt with:', email);
      }, 1500);
    });
  });
</script></main></body></html>
