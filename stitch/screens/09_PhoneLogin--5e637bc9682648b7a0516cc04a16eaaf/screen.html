<div class="absolute bottom-0 left-0 -ml-16 -mb-16 w-48 h-48 rounded-full bg-secondary-container/20 blur-3xl pointer-events-none"></div>

<div class="flex-1 flex flex-col items-center justify-start w-full max-w-md mx-auto pt-stack-lg">
<!-- Welcome Illustration/Iconography (Optional Delight) -->

</div>
<!-- Typography Header -->
<div class="text-center mb-stack-lg w-full px-gutter">
<h1 class="font-headline-lg-mobile text-on-surface mb-stack-sm tracking-tight">Login with Phone</h1>
<p class="font-body-md text-on-surface-variant max-w-[280px] mx-auto">We'll send a code to verify your number.</p>
</div>
<!-- Input Form Section -->
<form class="w-full flex flex-col gap-stack-md relative z-10" id="phone-login-form">
<!-- Input Group -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-on-surface ml-unit" for="phone-input">Phone Number</label>
<div class="flex flex-row items-stretch bg-surface-container rounded-xl shadow-sm focus-within:shadow-md transition-shadow relative overflow-hidden group">
<!-- Focus ring indicator -->
<div class="absolute inset-0 pointer-events-none border border-transparent group-focus-within:border-primary rounded-xl transition-colors"></div>
<!-- Country Code Selector (Simulated) -->
<button class="flex flex-row items-center gap-unit px-margin-mobile py-3 border-r border-outline-variant/30 text-on-surface hover:bg-surface-container-high transition-colors focus:outline-none min-w-[90px] justify-center z-10 relative" type="button">
<span class="text-xl leading-none">🇮🇳</span>
<span class="font-label-md">+91</span>
<span class="material-symbols-outlined text-[18px] text-on-surface-variant ml-[-4px]">arrow_drop_down</span>
</button>
<!-- Phone Input Field -->
<input autocomplete="tel-national" class="flex-1 bg-transparent py-3 px-margin-mobile font-body-lg text-on-surface placeholder:text-outline focus:outline-none z-10 relative tracking-wide" id="phone-input" maxlength="10" placeholder="Enter your number" type="tel"/>
</div>
<!-- Validation/Helper Text -->
<div class="flex flex-row items-center gap-base ml-unit text-outline" id="helper-text-container">
<span class="material-symbols-outlined text-[14px]">info</span>
<p class="font-label-sm">Enter a valid 10-digit number</p>
</div>
</div>
<!-- Primary Action Button -->
<div class="mt-stack-md">
<button class="w-full min-h-[48px] bg-primary text-on-primary rounded-full font-label-md flex items-center justify-center gap-unit shadow-md hover:shadow-lg active:scale-[0.98] transition-all disabled:opacity-50 disabled:active:scale-100 disabled:shadow-none relative overflow-hidden group" disabled="" id="submit-btn" type="submit">
<!-- Ripple Effect Container -->
<span class="absolute inset-0 bg-white/20 opacity-0 group-active:opacity-100 transition-opacity pointer-events-none"></span>
<span>Continue</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer / Privacy Note -->
<div class="mt-auto mb-stack-lg pt-stack-lg text-center w-full relative z-10">
<p class="font-label-sm text-outline-variant flex items-center justify-center gap-base">
<span class="material-symbols-outlined text-[14px]">shield</span>
                Standard SMS rates apply.
            </p>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const phoneInput = document.getElementById('phone-input');
        const submitBtn = document.getElementById('submit-btn');
        const helperTextContainer = document.getElementById('helper-text-container');
        const form = document.getElementById('phone-login-form');

        // Simple validation logic
        const validatePhone = (value) => {
            // Check if it's exactly 10 digits
            return /^\d{10}$/.test(value);
        };

        const formatPhoneNumber = (value) => {
            // Simple formatter: 12345 67890 (just spaces for readability while typing)
            // Strip non-digits first
            let raw = value.replace(/\D/g, '');
            if(raw.length > 5) {
                return raw.substring(0,5) + ' ' + raw.substring(5,10);
            }
            return raw;
        };

        phoneInput.addEventListener('input', (e) => {
            // Restrict input to numbers
            let val = e.target.value.replace(/\D/g, '');
            
            // Limit to 10 digits
            if (val.length > 10) {
                val = val.substring(0, 10);
            }
            
            // Only update value if different to avoid cursor jumps
            if(e.target.value !== val) {
                e.target.value = val;
            }

            const isValid = validatePhone(val);
            
            // Enable/Disable button
            if (isValid) {
                submitBtn.removeAttribute('disabled');
                helperTextContainer.classList.remove('text-error', 'text-outline');
                helperTextContainer.classList.add('text-secondary'); // Success color feedback
                helperTextContainer.innerHTML = `<span class="material-symbols-outlined text-[14px]">check_circle</span><p class="font-label-sm">Looks good!</p>`;
            } else {
                submitBtn.setAttribute('disabled', 'true');
                if (val.length > 0) {
                    helperTextContainer.classList.remove('text-secondary', 'text-outline');
                    helperTextContainer.classList.add('text-error');
                    helperTextContainer.innerHTML = `<span class="material-symbols-outlined text-[14px]">error</span><p class="font-label-sm">Must be 10 digits (${val.length}/10)</p>`;
                } else {
                    helperTextContainer.classList.remove('text-error', 'text-secondary');
                    helperTextContainer.classList.add('text-outline');
                    helperTextContainer.innerHTML = `<span class="material-symbols-outlined text-[14px]">info</span><p class="font-label-sm">Enter a valid 10-digit number</p>`;
                }
            }
        });

        // Form submission effect
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if(!submitBtn.hasAttribute('disabled')) {
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span><span>Sending code...</span>`;
                submitBtn.setAttribute('disabled', 'true');
                
                // Simulate network request
                setTimeout(() => {
                    // Navigate to OTP screen (simulation)
                    console.log('OTP requested for', phoneInput.value);
                    // Reset button for demo purposes
                    submitBtn.innerHTML = originalText;
                    submitBtn.removeAttribute('disabled');
                    // location.href = '/otp-screen'; // Real implementation
                }, 1500);
            }
        });
        
        // Auto-focus on load for quick entry (wrap in slight timeout for better mobile keyboard transition)
        setTimeout(() => {
            phoneInput.focus();
        }, 300);
    });
</script></main></body></html>
