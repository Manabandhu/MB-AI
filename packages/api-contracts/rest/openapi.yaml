openapi: 3.1.0
info:
  title: ManaBandhu REST API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Get health
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /me:
    get:
      operationId: getIdentity
      summary: Get identity
      description: Returns the identity of the authenticated user derived from the verified JWT principal. The role is read from trusted app_metadata, never from user-editable metadata.
      responses:
        '200':
          description: Authenticated user identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteMyAccount
      summary: Delete the caller's account
      description: >-
        Requires a sign-in within the last 10 minutes (the token's amr timestamp), otherwise 401 with reason
        reauth_required. Shared expense groups the caller owns pass to another member; then the auth user is deleted
        and the caller's rows cascade.
      responses:
        '204': { description: Account deleted }
        '401': { description: 'Not signed in, or the last sign-in is older than 10 minutes (reauth_required)' }
        '502': { description: The identity provider refused the deletion }
        '503': { description: Account deletion is not configured on this server }
  /foundation/welcome:
    get:
      operationId: getWelcomeFlow
      summary: Get welcome flow
      security: []
      responses:
        '200':
          description: Splash and welcome flow content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WelcomeFlow'
  /foundation/screens/{screenId}:
    get:
      operationId: getFoundationScreenContent
      summary: Get foundation screen content
      security: []
      parameters:
        - name: screenId
          in: path
          required: true
          schema:
            type: string
            enum: [onboarding, explore, search, saved, profile, settings]
      responses:
        '200':
          description: Public foundation screen content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogScreenContent'
        '404': { description: Unknown screen }
  /notifications/inbox:
    get:
      operationId: getNotificationsInbox
      summary: Get one page of the signed-in user's notifications
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: The caller's notifications, newest first (size capped at 50), with the total unread count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationInbox'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rooms/screens/{screenId}:
    get:
      operationId: getRoomsScreenContent
      summary: Get rooms screen content
      security: []
      parameters:
        - name: screenId
          in: path
          required: true
          schema:
            type: string
            enum: [home, search, map, filters, saved, my-listings, create-listing, details, edit]
      responses:
        '200':
          description: Demo-safe room discovery screen content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogScreenContent'
        '404': { description: Unknown screen }
  /rides/screens/{screenId}:
    get:
      operationId: getRidesScreenContent
      summary: Get rides screen content
      security: []
      parameters:
        - name: screenId
          in: path
          required: true
          schema:
            type: string
            enum: [home, search, map, filters, offer]
      responses:
        '200':
          description: Demo-safe ride discovery screen content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogScreenContent'
        '404': { description: Unknown screen }
  /posts:
    get:
      operationId: listCommunityPosts
      summary: List community posts
      description: >-
        Public. The newest 100 posts, with the author's display name, counts, and the signed-in viewer's own
        reaction.
      responses:
        '200':
          description: Community posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostView'
    post:
      operationId: createCommunityPost
      summary: Create community post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostInput'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostView'
        '400': { description: Validation failed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The caller has not joined the community }
        '404': { description: Community not found }
  /posts/{postId}:
    get:
      operationId: getCommunityPost
      summary: Get a community post
      description: Public. The viewer's own reaction is included when signed in.
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostView' }
        '404': { $ref: '#/components/responses/NotFound' }
  /posts/communities/{communityId}/posts:
    get:
      operationId: listCommunityPostsByCommunity
      summary: List a community's posts
      description: Public. The community's newest 100 posts.
      parameters:
        - name: communityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The community's posts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PostView' }
        '404': { $ref: '#/components/responses/NotFound' }
  /immigration/resources:
    get:
      operationId: listImmigrationResources
      summary: List immigration resources
      description: >-
        Public. Verified resources for everyone plus the caller's own unreviewed submissions (admins see all), newest
        200. Submitter ids are never returned; `mine` marks the caller's own (ImmigrationResourceView).
      responses:
        '200':
          description: Immigration resources (without submitter ids)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImmigrationResourceView'
      parameters:
        - name: category
          in: query
          schema: { type: string }
    post:
      operationId: createImmigrationResource
      summary: Create immigration resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImmigrationResourceInput'
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImmigrationResource'
  /immigration/guides:
    get:
      operationId: listImmigrationGuides
      summary: List immigration guides
      responses:
        '200':
          description: Immigration guides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImmigrationGuide'
      parameters:
        - name: category
          in: query
          schema: { type: string }
  /immigration/checklists:
    get:
      operationId: listImmigrationChecklists
      summary: List the caller's own immigration checklists (newest 200)
      responses:
        '401':
          description: Sign-in required
        '200':
          description: Immigration checklists owned by the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImmigrationChecklist'
      parameters:
        - name: category
          in: query
          schema: { type: string }
  /immigration/faq:
    get:
      operationId: listFaqItems
      summary: List faq items
      responses:
        '200':
          description: FAQ items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FaqItem'
      parameters:
        - name: category
          in: query
          schema: { type: string }
  /immigration/news:
    get:
      operationId: listImmigrationNews
      summary: List immigration news
      responses:
        '200':
          description: Immigration news
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImmigrationNews'
  /safety/reports:
    get:
      operationId: listSafetyReports
      summary: List safety reports
      responses:
        '200':
          description: Safety reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SafetyReport'
    post:
      operationId: createSafetyReport
      summary: Create safety report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSafetyReportInput'
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetyReport'
  /safety/reports/{id}/resolve:
    post:
      operationId: resolveSafetyReport
      summary: Resolve safety report
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Report resolved
  /safety/blocked-users:
    get:
      operationId: listBlockedUsers
      summary: List blocked users
      responses:
        '200':
          description: Blocked users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockedUser'
    post:
      operationId: blockUser
      summary: Block user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockUserInput'
      responses:
        '201':
          description: User blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedUser'
  /safety/blocked-users/{blockedUserId}/unblock:
    post:
      operationId: unblockUser
      summary: Unblock user
      parameters:
        - name: blockedUserId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: User unblocked
  /safety/trusted-contacts:
    get:
      operationId: listTrustedContacts
      summary: List trusted contacts
      responses:
        '200':
          description: Trusted contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrustedContact'
    post:
      operationId: createTrustedContact
      summary: Create trusted contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrustedContactInput'
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedContact'
  /utilities/packages:
    get:
      operationId: listPackageTrackings
      summary: List package trackings
      responses:
        '200':
          description: Package trackings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PackageTracking'
    post:
      operationId: createPackageTracking
      summary: Create package tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePackageTrackingInput'
      responses:
        '201':
          description: Tracking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageTracking'
  /utilities/nearby:
    get:
      operationId: listNearbyPlaces
      summary: List nearby places
      responses:
        '200':
          description: Nearby places
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NearbyPlace'
      parameters:
        - name: category
          in: query
          schema: { type: string }
  /utilities/emergency:
    get:
      operationId: listEmergencyResources
      summary: List emergency resources
      responses:
        '200':
          description: Emergency resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmergencyResource'
      parameters:
        - name: category
          in: query
          schema: { type: string }
  /notifications:
    post:
      operationId: createNotification
      summary: Create notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'
      responses:
        '201':
          description: Notification created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      summary: Get unread notification count
      responses:
        '200':
          description: Unread notification count
          content:
            application/json:
              schema:
                type: integer
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: Mark notification read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Notification marked read (recipient only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationInboxItem'
        '403': { $ref: '#/components/responses/Forbidden' }
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark all of the caller's notifications read
      responses:
        '200': { description: 'Count of notifications updated, as {"updated": n}' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/{id}:
    get:
      operationId: getNotification
      summary: Get one notification
      description: Recipient only. Reading does not mark it read; use POST /notifications/{id}/read.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Notification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationInboxItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /notifications/devices:
    post:
      operationId: registerPushDevice
      summary: Register this device's Expo push token for the caller
      description: Re-registering a token signed in as another account moves it to the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string, maxLength: 200, description: 'ExponentPushToken[...]' }
                platform: { type: string, enum: [ios, android] }
      responses:
        '200': { description: 'Registered device (id, platform, enabled)' }
        '400': { description: Not an Expo push token or unknown platform }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/devices/remove:
    post:
      operationId: removePushDevice
      summary: Remove one of the caller's push tokens
      description: POST with a body so tokens never appear in URLs or access logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 200 }
      responses:
        '204': { description: Removed }
        '404': { description: Not one of the caller's devices }
  /chat/conversations:
    get:
      operationId: listConversations
      summary: List conversations
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
    post:
      operationId: createConversation
      summary: Create conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationInput'
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
  /chat/conversations/{id}:
    get:
      operationId: getConversation
      summary: Get conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: 'Active participants and admins (an admin outside the conversation is audited and gets no unreadCount).'
      responses:
        '200':
          description: Conversation detail with the caller's unreadCount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ChatParticipantsOnly' }
  /chat/conversations/{id}/read:
    post:
      operationId: markConversationRead
      summary: Mark conversation read
      description: >-
        Active participants only (admins who are not members have no read state). Moves the caller's read marker to
        messageId's send time, or to now when no body or messageId is sent. The marker never moves backwards, so a late
        or repeated call is harmless. Returns the caller's remaining unread count.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkConversationReadInput'
      responses:
        '200':
          description: Read state after the update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationReadState'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ChatParticipantsOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chat/conversations/{id}/messages:
    get:
      operationId: listMessages
      summary: List messages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
    post:
      operationId: sendMessage
      summary: Send message
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageInput'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /chat/conversations/{id}/participants:
    get:
      operationId: listParticipants
      summary: List participants
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationParticipant'
    post:
      operationId: addParticipant
      summary: Add participant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddParticipantInput'
      responses:
        '201':
          description: Participant added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationParticipant'
  /assistant/conversations:
    get:
      operationId: listAssistantConversations
      summary: List assistant conversations
      responses:
        '200':
          description: Assistant conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssistantConversation'
    post:
      operationId: createAssistantConversation
      summary: Create assistant conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantConversation'
  /assistant/conversations/{id}/messages:
    get:
      operationId: listAssistantMessages
      summary: List assistant messages
      description: Owner (or admin) only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Assistant messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssistantMessage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
  /assistant/messages:
    get:
      operationId: listLatestAssistantMessages
      summary: List messages of my latest assistant conversation
      description: Messages of the caller's most recent conversation; empty when the caller has none.
      responses:
        '200':
          description: Assistant messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssistantMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: sendAssistantMessage
      summary: Send assistant message
      description: >-
        Appends the caller's message to their most recent conversation (creating one when they have none) and
        returns the assistant's reply. Until the AI orchestrator is connected the reply is a fixed notice that the
        assistant is not available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAssistantMessageInput'
      responses:
        '201':
          description: The assistant's reply (role ASSISTANT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantMessage'
        '400': { description: Content is blank or longer than 4000 characters }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /assistant/history:
    get:
      operationId: listAssistantHistory
      summary: List my assistant conversations
      description: The caller's conversations (same data as GET /assistant/conversations).
      responses:
        '200':
          description: Assistant conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssistantConversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /assistant/citations:
    get:
      operationId: listLatestAssistantCitations
      summary: List citations of my latest assistant conversation
      description: Citations attached to messages in the caller's most recent conversation.
      responses:
        '200':
          description: Citations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssistantCitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /assistant/messages/{id}/citations:
    get:
      operationId: listAssistantCitations
      summary: List assistant citations
      description: Owner of the message's conversation (or admin) only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Citations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssistantCitation'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/amenities:
    get:
      operationId: listRoomAmenities
      summary: List the amenity catalog
      security: []
      responses:
        '200':
          description: Amenity catalog entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoomAmenityCatalogEntry' }
  /rooms/listings:
    get:
      operationId: listRoomListings
      summary: Search published room listings
      description: >-
        Public. Returns active and paused listings only, newest first; a client-supplied sort is ignored. Page size is
        capped at 500. Coordinates in each listing are rounded to 2 decimals.
      security: []
      parameters:
        - { name: location, in: query, required: false, description: Alias of city (city wins when both are set), schema: { type: string } }
        - { name: city, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: roomType, in: query, required: false, schema: { type: string } }
        - { name: dietaryPreference, in: query, required: false, schema: { $ref: '#/components/schemas/RoomDietaryPreference' } }
        - { name: genderPreference, in: query, required: false, schema: { $ref: '#/components/schemas/RoomGenderPreference' } }
        - { name: minRent, in: query, required: false, schema: { type: number } }
        - { name: maxRent, in: query, required: false, schema: { type: number } }
        - { name: privateBathOnly, in: query, required: false, description: When true only PRIVATE_ATTACHED bathrooms match, schema: { type: boolean } }
        - { name: lat, in: query, required: false, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: false, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radiusMiles, in: query, required: false, schema: { type: number, exclusiveMinimum: 0 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 20 } }
      responses:
        '200':
          description: One page of public room listings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomListingPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createRoomListing
      summary: Create room listing
      description: The listing starts as a draft owned by the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoomListingInput' }
      responses:
        '201':
          description: Listing created
          headers:
            Location: { description: URL of the new listing, schema: { type: string } }
