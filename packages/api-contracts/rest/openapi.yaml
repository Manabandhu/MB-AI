      description: >-
        Owner or admin. Null fields are left unchanged; amenities replaces the whole set when present. A status change
        must follow the listing transition rules.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoomListingInput' }
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
