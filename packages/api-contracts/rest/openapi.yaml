            application/json:
              schema: { $ref: '#/components/schemas/OwnerRoomListing' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rooms/listings/{listingId}:
    parameters:
      - $ref: '#/components/parameters/RoomListingId'
    get:
      operationId: getRoomListing
