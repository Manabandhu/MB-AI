        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        evidenceUrls: { type: string, maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
    CreateSafetyReportInput:
