    RideWeekday:
      type: string
      enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
    RideOfferView:
      type: object
      additionalProperties: false
      description: >-
        A ride as the viewer may see it. Members (the driver, passengers with a live booking or accepted request, and
        admins) get every field. For anyone else driverId, conversationId and routePolyline are null and the four
        coordinates are rounded to 2 decimals (about 1 km). Search results count only the driver and admins as
        members.
      required: [id, driverId, isDriver, isMember, originArea, destinationArea, originLat, originLng, destinationLat, destinationLng, routePolyline, distanceMiles, estimatedDurationMins, tollPreference, estimatedTollAmount, isRecurring, recurrencePattern, recurringDays, luggageCapacity, genderPreference, completedAt, conversationId, chatExpiresAt, departureAt, seatsTotal, seatsAvailable, contribution, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        driverId: { type: [string, 'null'], format: uuid, description: Members only; null for everyone else }
        isDriver: { type: boolean, description: True when the viewer is the driver }
        isMember: { type: boolean, description: True when the viewer sees the full member view }
        originArea: { type: string, maxLength: 200 }
        destinationArea: { type: string, maxLength: 200 }
        originLat: { type: [number, 'null'], description: 'Exact for members; rounded to 2 decimals for everyone else' }
        originLng: { type: [number, 'null'], description: 'Exact for members; rounded to 2 decimals for everyone else' }
        destinationLat: { type: [number, 'null'], description: 'Exact for members; rounded to 2 decimals for everyone else' }
        destinationLng: { type: [number, 'null'], description: 'Exact for members; rounded to 2 decimals for everyone else' }
        routePolyline: { type: [string, 'null'], description: Encoded route; members only }
        distanceMiles: { type: [number, 'null'] }
        estimatedDurationMins: { type: [integer, 'null'] }
        tollPreference: { anyOf: [{ $ref: '#/components/schemas/RideTollPreference' }, { type: 'null' }] }
        estimatedTollAmount: { type: [number, 'null'] }
        isRecurring: { type: [boolean, 'null'] }
        recurrencePattern: { anyOf: [{ $ref: '#/components/schemas/RideRecurrencePattern' }, { type: 'null' }] }
        recurringDays: { type: [array, 'null'], items: { $ref: '#/components/schemas/RideWeekday' } }
        luggageCapacity: { anyOf: [{ $ref: '#/components/schemas/RideLuggageCapacity' }, { type: 'null' }] }
        genderPreference: { anyOf: [{ $ref: '#/components/schemas/RideGenderPreference' }, { type: 'null' }] }
        completedAt: { type: [string, 'null'], format: date-time }
        conversationId: { type: [string, 'null'], format: uuid, description: Ride chat id; members only }
        chatExpiresAt: { type: [string, 'null'], format: date-time, description: Two hours after completion }
        departureAt: { type: string, format: date-time }
        seatsTotal: { type: integer, minimum: 1, maximum: 8 }
        seatsAvailable: { type: integer, minimum: 0, maximum: 8 }
        contribution: { type: string, maxLength: 200 }
        status: { $ref: '#/components/schemas/RideOfferStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
