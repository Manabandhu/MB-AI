      operationId: getNotificationSettings
      summary: Get notification settings
      description: >-
        The caller's notification settings (defaults merged with saved values): boolean channel and category
        toggles plus quietHours (boolean), quietStart/quietEnd ("HH:mm") and timeZone (IANA).
      responses:
        '200': { description: Settings }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateNotificationSettings
      summary: Update notification settings
      description: >-
        Merges known keys into the caller's own settings; unknown keys are ignored. A known key with the wrong type
        or format is a 400, so nothing is silently dropped.
      responses:
        '200': { description: Settings }
        '400': { description: A known key has an invalid value }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /immigration/resources/{resourceId}:
    get:
      operationId: getImmigrationResource
      summary: Get immigration resource
      security: []
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Resource }
        '404': { description: Not found }
  /admin/users:
    get:
      operationId: listAdminUsers
      summary: List admin users
      description: ADMIN or SUPER_ADMIN. Newest 200 accounts from Supabase Auth.
      responses:
        '200': { description: Users }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: User directory is not available }
  /admin/users/{id}/status:
    patch:
      operationId: updateAdminUserStatus
      summary: Update admin user status
      description: Suspends (bans) or reactivates an account through the Supabase Auth admin API. Audited.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [Active, Suspended] } } }
      responses:
        '200': { description: Updated user }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/rooms:
    get: { operationId: listAdminRooms, summary: List admin rooms, responses: { '200': { description: Newest 200 room listings } } }
  /admin/jobs:
    get: { operationId: listAdminJobs, summary: List admin jobs, responses: { '200': { description: Newest 200 job postings } } }
  /admin/events:
    get: { operationId: listAdminEvents, summary: List admin events, responses: { '200': { description: Newest 200 events } } }
  /admin/community:
    get: { operationId: listAdminCommunityPosts, summary: List admin community posts, responses: { '200': { description: Newest 200 community posts } } }
  /admin/audit-log:
    get: { operationId: listAdminAuditLog, summary: List admin audit log, responses: { '200': { description: Newest 200 privileged actions } } }
