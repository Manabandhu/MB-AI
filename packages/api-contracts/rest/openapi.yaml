      responses:
        '204': { description: Saved search deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/listings/{listingId}/report:
    post:
      operationId: reportRoomListing
      summary: Report room listing
      description: Any signed-in user who can see the listing, except its owner; one open report per listing and reporter.
      parameters:
        - $ref: '#/components/parameters/RoomListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReportInput' }
      responses:
        '201':
          description: Report created with status open
          headers:
            Location: { description: URL of the new report, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomReport' }
        '400': { description: 'Validation failed, or the caller owns the listing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The caller already has an open report for this listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /rooms/my-reports:
    get:
      operationId: listMyReports
      summary: List my reports
      description: Reports the caller submitted, newest 200 first.
      responses:
        '200':
          description: Reports submitted by the caller
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: '#/components/schemas/RoomReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rooms/listings/{listingId}/analytics:
    get:
      operationId: getRoomAnalytics
      summary: Get room analytics
      description: Listing owner or admin.
      parameters:
        - $ref: '#/components/parameters/RoomListingId'
      responses:
        '200':
          description: Event counts for the listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomAnalytics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/admin/reports:
    get:
      operationId: listReviewQueue
      summary: List review queue
      description: Admin only. Newest 200 reports in the given status.
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/RoomReportStatus', default: open } }
      responses:
        '200':
          description: Moderator review queue
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: '#/components/schemas/RoomReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ModeratorRequired' }
  /rooms/admin/reports/{reportId}/review:
    post:
      operationId: reviewReport
      summary: Review report
      description: Admin only. Records the caller as reviewer and stamps reviewedAt.
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: true, schema: { $ref: '#/components/schemas/RoomReportStatus' } }
        - { name: resolution, in: query, required: false, schema: { type: string, maxLength: 4000 } }
      responses:
        '200':
          description: Report reviewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ModeratorRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/admin/listings/{listingId}/moderate:
    post:
      operationId: moderateRoomListing
      summary: Moderate room listing
      description: Admin only. The target status must follow the admin transition rules (for example active to rejected).
      parameters:
        - $ref: '#/components/parameters/RoomListingId'
        - { name: status, in: query, required: true, schema: { $ref: '#/components/schemas/RoomListingStatus' } }
      responses:
        '200':
          description: Listing moderated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerRoomListing' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ModeratorRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /rides/offers:
    get:
      operationId: listRideOffers
      summary: Search ride offers
      description: 'Public; a bearer token is optional. Returns active offers that have not departed, soonest departure first; a client-supplied sort is ignored. Page size is capped at 500. Search results treat only the driver and admins as members, so for everyone else driverId, conversationId and routePolyline are null and coordinates are rounded to 2 decimals.'
      security: []
      parameters:
        - { name: origin, in: query, required: false, description: Case-insensitive substring of originArea, schema: { type: string } }
        - { name: destination, in: query, required: false, description: Case-insensitive substring of destinationArea, schema: { type: string } }
        - { name: avoidTolls, in: query, required: false, description: When true only AVOID_TOLLS (or unset) offers match; false or absent does not filter, schema: { type: boolean } }
        - { name: genderPreference, in: query, required: false, description: Matches offers with this preference or ANY (or unset), schema: { $ref: '#/components/schemas/RideGenderPreference' } }
        - { name: isRecurring, in: query, required: false, schema: { type: boolean } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 20 } }
      responses:
        '200':
          description: One page of upcoming active ride offers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOfferPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createRideOffer
      summary: Create ride offer
      description: 'The caller becomes the driver. The offer starts active with seatsAvailable equal to seatsTotal.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRideOfferInput' }
      responses:
        '201':
          description: Ride offer created
          headers:
            Location: { description: URL of the new offer, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOfferView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rides/offers/{offerId}:
    get:
      operationId: getRideOffer
      summary: Get ride offer
      description: 'Public; a bearer token is optional. Members (the driver, passengers with a live booking or accepted request, and admins) get the full view; everyone else gets null driverId, conversationId and routePolyline and coordinates rounded to 2 decimals.'
      security: []
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      responses:
        '200':
          description: Ride offer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOfferView' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateRideOffer
      summary: Update ride offer
      description: 'Driver or admin. Null or absent fields are left unchanged. Status, completedAt, conversationId and chatExpiresAt cannot be set here (use PATCH .../status and POST .../chat); unknown fields are ignored. seatsTotal can never drop below the seats riders hold (live bookings plus accepted requests); when only seatsTotal is sent, seatsAvailable becomes seatsTotal minus held seats, and it may never exceed that.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRideOfferInput' }
      responses:
        '200':
          description: Updated ride offer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOfferView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The ride is completed or cancelled and cannot be edited, or seatsTotal is below the seats riders already hold
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    delete:
      operationId: deleteRideOffer
      summary: Delete ride offer
      description: 'Driver or admin. Like a cancel, first cancels live bookings, rejects pending and accepted requests, removes riders from the participants and the ride chat, and notifies them.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      responses:
        '204': { description: Ride offer deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rides/{offerId}:
    get:
      operationId: getRideOfferShortPath
      summary: Get ride offer (short path)
      description: 'Same operation as GET /rides/offers/{offerId}. Public.'
      security: []
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      responses:
        '200':
          description: Ride offer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOfferView' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateRideOfferShortPath
      summary: Update ride offer (short path)
      description: 'Same operation as PATCH /rides/offers/{offerId}.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRideOfferInput' }
      responses:
        '200':
          description: Updated ride offer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOfferView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The ride is completed or cancelled and cannot be edited, or seatsTotal is below the seats riders already hold
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    delete:
      operationId: deleteRideOfferShortPath
      summary: Delete ride offer (short path)
      description: 'Same operation as DELETE /rides/offers/{offerId}.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      responses:
        '204': { description: Ride offer deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rides/offers/{offerId}/owner:
    get:
      operationId: getRideOfferForOwner
      summary: Get ride offer for driver
      description: 'Driver or admin. Returns the full member view in any status.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      responses:
        '200':
          description: Driver-facing ride offer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOfferView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rides/{offerId}/owner:
    get:
      operationId: getRideOfferForOwnerShortPath
      summary: Get ride offer for driver (short path)
      description: 'Same operation as GET /rides/offers/{offerId}/owner.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      responses:
        '200':
          description: Driver-facing ride offer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOfferView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rides/offers/{offerId}/status:
    patch:
      operationId: updateRideOfferStatus
      summary: Change ride status
      description: 'Driver or admin. The value is trimmed and matched case-insensitively and stored lowercase. Allowed transitions: draft -> active | cancelled; active -> in_progress | completed | cancelled; in_progress -> completed | cancelled; completed and cancelled are terminal. Setting the current status is a no-op. Cancelling cancels every live booking, rejects pending and accepted requests, resets seatsAvailable to seatsTotal, removes riders from the participants and the ride chat, and notifies each rider. Completing sets completedAt and chatExpiresAt (two hours later).'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRideStatusInput' }
      responses:
        '200':
          description: Ride offer with the new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOfferView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /rides/{offerId}/status:
    patch:
      operationId: updateRideOfferStatusShortPath
      summary: Change ride status (short path)
      description: 'Same operation as PATCH /rides/offers/{offerId}/status.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRideStatusInput' }
      responses:
        '200':
          description: Ride offer with the new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOfferView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /rides/offers/{offerId}/re-activate:
    post:
      operationId: reactivateRideOffer
      summary: Re-activate ride offer
      description: 'The driver only (admins cannot create rides for others). Clones the ride as a new active offer with the given departure; seats, route and preferences are copied, bookings and chat are not. The original is unchanged.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReactivateRideInput' }
      responses:
        '201':
          description: New ride offer cloned from the original
          headers:
            Location: { description: URL of the new offer, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOfferView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rides/{offerId}/re-activate:
    post:
      operationId: reactivateRideOfferShortPath
      summary: Re-activate ride offer (short path)
      description: 'Same operation as POST /rides/offers/{offerId}/re-activate.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReactivateRideInput' }
      responses:
        '201':
          description: New ride offer cloned from the original
          headers:
            Location: { description: URL of the new offer, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOfferView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rides/offers/{offerId}/chat:
    post:
      operationId: provisionRideChat
      summary: Open ride chat
      description: 'Members only (driver, passengers with a live booking or accepted request, admins). Creates the ride''s temporary conversation on first call (adding the driver, the caller and confirmed passengers) and adds the caller on later calls. The chat is deleted two hours after the ride is completed.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      responses:
        '200':
          description: Ride chat conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideChatResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RideMembersOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rides/{offerId}/chat:
    post:
      operationId: provisionRideChatShortPath
      summary: Open ride chat (short path)
      description: 'Same operation as POST /rides/offers/{offerId}/chat.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      responses:
        '200':
          description: Ride chat conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideChatResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RideMembersOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rides/my-offers:
    get:
      operationId: listMyRideOffers
      summary: List my ride offers
      description: 'The caller''s newest 200 offers as a driver, in every status.'
      responses:
        '200':
          description: The caller's offers
          content:
            application/json:
              schema: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/RideOfferView' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rides/mine:
    get:
      operationId: listMyRideOffersShortPath
      summary: List my ride offers (short path)
      description: 'Same operation as GET /rides/my-offers.'
      responses:
        '200':
          description: The caller's offers
          content:
            application/json:
              schema: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/RideOfferView' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rides/history:
    get:
      operationId: listRideHistory
      summary: List ride history
      description: 'Up to 200 rides the caller drove, booked (booking not cancelled) or was accepted on that are completed, cancelled or already departed, latest departure first.'
      responses:
        '200':
          description: Past rides
          content:
            application/json:
              schema: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/RideOfferView' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rides/saved:
    get:
      operationId: listSavedRides
      summary: List saved rides
      description: 'Bookmarked rides (newest bookmark first), then rides the caller participates in.'
      responses:
        '200':
          description: Saved and joined rides
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RideOfferView' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rides/offers/{rideId}/favorite:
    post:
      operationId: saveRide
      summary: Save ride
      description: 'Bookmarks the ride for the caller; saving twice is a no-op.'
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: The bookmarked ride
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOfferView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: unsaveRide
      summary: Unsave ride
      description: 'Removes the caller''s bookmark; succeeds even when none exists.'
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '204': { description: Bookmark removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rides/{rideId}/favorite:
    post:
      operationId: saveRideShortPath
      summary: Save ride (short path)
      description: 'Same operation as POST /rides/offers/{rideId}/favorite.'
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: The bookmarked ride
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOfferView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: unsaveRideShortPath
      summary: Unsave ride (short path)
      description: 'Same operation as DELETE /rides/offers/{rideId}/favorite.'
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '204': { description: Bookmark removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rides/offers/{offerId}/seats:
    patch:
      operationId: adjustRideSeats
      summary: Open or block seats
      description: 'Driver or admin. Adds the seats delta (negative blocks seats) to seatsAvailable, clamped between 0 and seatsTotal minus the seats riders hold.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
        - { name: seats, in: query, required: true, description: Seats to open (positive) or block (negative), schema: { type: integer } }
      responses:
        '200':
          description: Ride offer with adjusted seats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOfferView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rides/offers/{offerId}/requests:
    get:
      operationId: listRideRequests
      summary: List seat requests for a ride
      description: 'The driver and admins see every request, newest first; anyone else sees only their own.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      responses:
        '200':
          description: Seat requests
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RideRequest' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createRideRequest
      summary: Request seats on a ride
      description: 'Creates a pending request and notifies the driver. Women-only and men-only rides require a verified gender in the token.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRideRequestInput' }
      responses:
        '201':
          description: Seat request created
          headers:
            Location: { description: URL of the new request, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The ride is limited to verified riders of another gender
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The caller is the driver, the ride is not active or has departed, or the caller already has a pending or accepted request
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /rides/requests/{requestId}:
    get:
      operationId: getRideRequest
      summary: Get seat request
      description: 'The rider, the driver, or an admin.'
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Seat request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteRideRequest
      summary: Delete seat request
      description: 'The rider or an admin. An accepted request holds seats, so it must be withdrawn instead.'
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Seat request deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The request is accepted; withdraw it instead
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /rides/requests/{requestId}/status:
    patch:
      operationId: updateRideRequestStatus
      summary: Answer or withdraw seat request
      description: 'The value is matched case-insensitively. Transitions: pending -> accepted | rejected (driver or admin), pending -> withdrawn (rider), accepted -> rejected (driver) or withdrawn (rider); rejected and withdrawn are terminal. Setting the current status is a no-op. Accepting reserves the seats and adds the rider as a participant; leaving accepted returns the seats and removes the rider from the participants and chat unless they still hold a booking. The other side is notified.'
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRideRequestStatusInput' }
      responses:
        '200':
          description: Updated seat request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The transition is not allowed, or accepting failed because the ride is not active, has departed, the rider already holds seats, or not enough seats are available
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /rides/my-requests:
    get:
      operationId: listMyRideRequests
      summary: List my seat requests
      description: 'The caller''s newest 200 seat requests across rides.'
      responses:
        '200':
          description: The caller's seat requests
          content:
            application/json:
              schema: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/RideRequest' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rides/offers/{offerId}/participants:
    get:
      operationId: listRideParticipants
      summary: List ride participants
      description: 'Members only (driver, passengers with a live booking or accepted request, admins). Oldest first.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      responses:
        '200':
          description: Ride participants
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RideParticipant' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RideMembersOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: joinRide
      summary: Join ride as participant
      description: 'Idempotent: returns the caller''s existing participant row when there is one. The role is derived server-side (driver for the driver, rider otherwise) and there is no request body. Riders must already hold a live booking or an accepted request.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      responses:
        '201':
          description: The caller's participant row (new or existing)
          headers:
            Location: { description: URL of the participant row, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideParticipant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The caller has no booking or accepted request on this ride
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /rides/participants/{participantId}:
    delete:
      operationId: deleteRideParticipant
      summary: Remove ride participant
      description: 'The participant, the driver, or an admin. A rider who still holds seats must cancel the booking or withdraw the request instead, which also returns the seats.'
      parameters:
        - { name: participantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Participant removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The rider still holds a live booking or an accepted request
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /rides/offers/{offerId}/bookings:
    get:
      operationId: listRideBookings
      summary: List bookings for a ride
      description: 'The driver and admins see every booking, newest first; anyone else sees only their own.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      responses:
        '200':
          description: Ride bookings
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RideBooking' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createRideBooking
      summary: Book seats on a ride
      description: 'Books seats instantly: the booking is created confirmed, the seats are taken and the caller is added as a rider participant. Women-only and men-only rides require a verified gender in the token.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRideBookingInput' }
      responses:
        '201':
          description: Booking created
          headers:
            Location: { description: URL of the new booking, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideBooking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The ride is limited to verified riders of another gender
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The caller is the driver, the ride is not active or has departed, the caller already has a live booking or an accepted request, or not enough seats are available
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /rides/bookings/{bookingId}:
    get:
      operationId: getRideBooking
      summary: Get ride booking
      description: 'The passenger, the driver, or an admin.'
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ride booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideBooking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteRideBooking
      summary: Delete ride booking
      description: 'The passenger, the driver, or an admin. A live booking returns its seats first; the passenger leaves the participants and chat unless they still hold an accepted request.'
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Booking deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rides/bookings/{bookingId}/status:
    patch:
      operationId: updateRideBookingStatus
      summary: Change ride booking status
      description: 'The value is matched case-insensitively. The passenger may cancel; the driver or an admin may confirm or cancel. Cancelled is terminal: it returns the seats and removes the passenger from the participants and chat unless they still hold an accepted request. Setting the current status is a no-op.'
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRideBookingStatusInput' }
      responses:
        '200':
          description: Updated booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideBooking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The booking is cancelled and cannot be reopened; book again instead
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /rides/my-bookings:
    get:
      operationId: listMyRideBookings
      summary: List my ride bookings
      description: 'The caller''s newest 200 bookings across rides.'
      responses:
        '200':
          description: The caller's bookings
          content:
            application/json:
              schema: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/RideBooking' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rides/offers/{offerId}/ratings:
    get:
      operationId: listRideRatings
      summary: List ride ratings
      description: 'Public. Up to 200 ratings, newest first, with the score and comment only (no rater or ratee ids). An unknown ride returns an empty list.'
      security: []
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      responses:
        '200':
          description: Ride ratings
          content:
            application/json:
              schema: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/RideRatingView' } }
    post:
      operationId: rateRide
      summary: Rate a ride participant
      description: 'The driver and passengers of a completed ride rate each other, once per pair. A passenger may omit rateeId to rate the driver.'
      parameters:
        - $ref: '#/components/parameters/RideOfferId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRideRatingInput' }
      responses:
        '201':
          description: Rating created
          headers:
            Location: { description: URL of the new rating, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideRating' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The caller or the ratee did not share this ride
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The ride is not completed yet, or the caller already rated this person for this ride
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /rides/ratings/{ratingId}:
    get:
      operationId: getRideRating
      summary: Get ride rating
      description: 'Score and comment only, without who rated whom.'
      parameters:
        - { name: ratingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ride rating
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideRatingView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteRideRating
      summary: Delete ride rating
      description: 'The rater or an admin.'
      parameters:
        - { name: ratingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Rating deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The caller did not write this rating and is not an admin
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /rides/my-ratings:
    get:
      operationId: listMyRideRatings
      summary: List ratings about me
      description: 'Up to 200 ratings where the caller is the ratee, newest first.'
      responses:
        '200':
          description: Ratings the caller received
          content:
            application/json:
              schema: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/RideRating' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rides/maps/route:
    get:
      operationId: getRideRoute
      summary: Get driving route
      description: 'Google Directions proxy; the key stays server-side. Counts toward the caller''s 60 map lookups per minute.'
      parameters:
        - { name: originLat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: originLng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: destinationLat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: destinationLng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: avoidTolls, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Route summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideRoute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No route found
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '429': { $ref: '#/components/responses/MapsRateLimited' }
        '502': { $ref: '#/components/responses/MapsProviderUnavailable' }
        '503': { $ref: '#/components/responses/MapsNotConfigured' }
  /rides/maps/autocomplete:
    get:
      operationId: autocompletePlaces
      summary: Autocomplete places
      description: 'Google Places Autocomplete proxy limited to the US. A blank query or one over 200 characters returns an empty list without calling Google or counting toward the 60 lookups per minute.'
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Place predictions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlacePrediction' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/MapsRateLimited' }
        '502': { $ref: '#/components/responses/MapsProviderUnavailable' }
        '503': { $ref: '#/components/responses/MapsNotConfigured' }
  /rides/maps/geocode:
    get:
      operationId: geocodeAddress
      summary: Geocode address
      description: 'Google Geocoding proxy. Counts toward the caller''s 60 map lookups per minute.'
      parameters:
        - { name: address, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 300 } }
      responses:
        '200':
          description: Coordinates of the best match
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LatLng' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Address not found
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '429': { $ref: '#/components/responses/MapsRateLimited' }
        '502': { $ref: '#/components/responses/MapsProviderUnavailable' }
        '503': { $ref: '#/components/responses/MapsNotConfigured' }
  /marketplace/screens/{screenId}:
    get:
      operationId: getMarketplaceScreenContent
      summary: Get marketplace screen content
      description: Public. Counts come from the database; saved and own-listing counts appear only for a signed-in viewer.
      security: []
      parameters:
        - name: screenId
          in: path
          required: true
          schema:
            type: string
            enum: [home, search, categories, sell, saved]
      responses:
        '200':
          description: Marketplace screen content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogScreenContent' }
        '404': { description: Unknown screen }
  /marketplace/categories:
    get:
      operationId: listMarketplaceCategories
      summary: List listing categories
      description: Public. Ordered by name, at most 200.
      security: []
      responses:
        '200':
          description: Listing categories
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: '#/components/schemas/ListingCategory' }
    post:
      operationId: createMarketplaceCategory
      summary: Create listing category
      description: Admin (moderator) only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateListingCategoryInput' }
      responses:
        '201':
          description: Category created
          headers:
            Location: { description: URL of the new category, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingCategory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ModeratorRequired' }
        '409':
          description: A category with this slug already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /marketplace/categories/{categoryId}:
    get:
      operationId: getMarketplaceCategory
      summary: Get listing category
      security: []
      parameters:
        - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Listing category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingCategory' }
        '404': { $ref: '#/components/responses/NotFound' }
  /marketplace/listings:
    get:
      operationId: listMarketplaceListings
      summary: Search marketplace listings
      description: >-
        Public. Newest first; a client-supplied sort is ignored. Only active listings are returned unless
        includeClosed also asks for reserved and sold ones; removed listings never appear. Page size is capped at 100.
      security: []
      parameters:
        - { name: q, in: query, required: false, description: Text matched against the title and description, schema: { type: string } }
        - { name: categoryId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: condition, in: query, required: false, schema: { $ref: '#/components/schemas/ListingCondition' } }
        - { name: maxPrice, in: query, required: false, schema: { type: number, minimum: 0 } }
        - { name: includeClosed, in: query, required: false, description: Also return reserved and sold listings, schema: { type: boolean, default: false } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: One page of public listings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createMarketplaceListing
      summary: Create marketplace listing
      description: The listing is owned by the caller and starts active. An unknown categoryId is a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateListingInput' }
      responses:
        '201':
          description: Listing created
          headers:
            Location: { description: URL of the new listing, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /marketplace/listings/mine:
    get:
      operationId: listMyMarketplaceListings
      summary: List my marketplace listings
      description: The caller's newest 200 listings in every status, removed included.
      responses:
        '200':
          description: The caller's listings
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: '#/components/schemas/ListingView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /marketplace/listings/{listingId}:
    parameters:
      - $ref: '#/components/parameters/MarketplaceListingId'
    get:
      operationId: getMarketplaceListing
      summary: Get marketplace listing
      description: >-
        Public for active, reserved and sold listings. A removed listing is a 404 to anyone but its owner and
        moderators.
      security: []
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingView' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateMarketplaceListing
      summary: Update marketplace listing
      description: >-
        Owner or admin. Null fields are left unchanged; an empty string clears description, condition and location.
        Owners may change status active to reserved or sold, reserved to active or sold, and sold to active; any other
        owner change is a 409. Setting status to removed, or changing a removed listing, is moderator-only (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateListingInput' }
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
    delete:
      operationId: deleteMarketplaceListing
      summary: Delete marketplace listing
      description: Owner or admin. Also deletes the listing's photos and their stored files.
      responses:
        '204': { description: Listing deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
  /marketplace/listings/{listingId}/images:
    parameters:
      - $ref: '#/components/parameters/MarketplaceListingId'
    get:
      operationId: listMarketplaceListingImages
      summary: List listing photos
      description: Public for active, reserved and sold listings; a removed listing is a 404 except for its owner and moderators.
      security: []
      responses:
        '200':
          description: Photos ordered by sortOrder
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items: { $ref: '#/components/schemas/ListingImage' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addMarketplaceListingImage
      summary: Add listing photo
      description: >-
        Owner or admin. The URL must point at an image uploaded through ManaBandhu storage into the marketplace bucket
        under the owner's or acting admin's folder (400 otherwise). A listing holds at most 10 photos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddListingImageInput' }
      responses:
        '201':
          description: Photo added
          headers:
            Location: { description: URL of the new photo, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingImage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The listing already has 10 photos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /marketplace/images/{imageId}:
    delete:
      operationId: deleteMarketplaceListingImage
      summary: Delete listing photo
      description: Owner of the photo's listing or admin. Also deletes the stored file.
      parameters:
        - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Photo deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
  /marketplace/listings/{listingId}/contact:
    post:
      operationId: contactMarketplaceSeller
      summary: Chat with the seller
      description: >-
        Opens a direct chat between the caller and the seller about this listing, or returns the caller's existing
        one (created false). A new chat needs the listing to be active or reserved.
      parameters:
        - $ref: '#/components/parameters/MarketplaceListingId'
      responses:
        '200':
          description: The conversation to open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingContactResponse' }
        '400': { description: 'The caller owns the listing ({error, message} body)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The item is sold or removed and the caller has no chat about it yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /marketplace/listings/{listingId}/report:
    post:
      operationId: reportMarketplaceListing
      summary: Report marketplace listing
      description: Any signed-in user who can see the listing, except its owner; one open report per listing and reporter.
      parameters:
        - $ref: '#/components/parameters/MarketplaceListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateListingReportInput' }
      responses:
        '201':
          description: Report created with status open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingReportResponse' }
        '400': { description: 'Validation failed, or the caller owns the listing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The caller already has an open report for this listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /marketplace/listings/{listingId}/favorite:
    parameters:
      - $ref: '#/components/parameters/MarketplaceListingId'
    post:
      operationId: favoriteMarketplaceListing
      summary: Save a marketplace listing
      description: >-
        Idempotent; saving an already saved listing returns the existing favorite with 201. Only active listings can
        be newly saved, and never your own.
      responses:
        '201':
          description: Listing saved
          headers:
            Location: { description: URL of the favorite, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingFavorite' }
        '400': { description: 'The caller owns the listing ({error, message} body)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The listing is not active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      operationId: unfavoriteMarketplaceListing
      summary: Remove a saved marketplace listing
      description: Idempotent; succeeds even when the listing was not saved.
      responses:
        '204': { description: Listing removed from saved }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /marketplace/favorites:
    get:
      operationId: listMarketplaceFavorites
      summary: List my marketplace favorites
      description: The caller's newest 200 favorite records.
      responses:
        '200':
          description: Favorite records
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: '#/components/schemas/ListingFavorite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /marketplace/favorites/listings:
    get:
      operationId: listMarketplaceFavoriteListings
      summary: List my saved marketplace listings
      description: The caller's newest 200 saved listings that are still public (active, reserved or sold).
      responses:
        '200':
          description: Saved listings
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: '#/components/schemas/ListingView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /posts/communities:
    get:
      operationId: listCommunities
      summary: List communities
      security: []
      description: Public. Community cards; `isJoined` is true for communities the signed-in caller has joined.
      responses:
        '200':
          description: Communities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommunityView' }
    post:
      operationId: createCommunity
      summary: Create community
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommunityInput' }
      responses:
        '201':
          description: Community created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Community' }
        '400': { description: Validation failed }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /posts/communities/{communityId}:
    get:
      operationId: getCommunity
      summary: Get a community
      security: []
      description: Public. `isJoined` is true when the signed-in caller has joined it.
      parameters:
        - { name: communityId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The community
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityView' }
        '404': { $ref: '#/components/responses/NotFound' }
  /posts/{postId}/comments:
    get:
      operationId: listPostComments
      summary: List post comments
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Post comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommentView' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createPostComment
      summary: Create post comment
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostCommentInput' }
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentView' }
        '400': { description: Validation failed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /posts/{postId}/reactions:
    get:
      operationId: listPostReactions
      summary: List post reactions
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Count per reaction type (public; no user ids)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReactionCount' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createPostReaction
      summary: Create post reaction
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostReactionInput' }
      responses:
        '201':
          description: The caller's reaction (replaces an earlier one)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostReaction' }
        '400': { description: 'Type is not LIKE, HELPFUL or HEART' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deletePostReaction
      summary: Remove my reaction
      description: Removes only the caller's own reaction. Idempotent.
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Reaction removed (or there was none) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events:
    get:
      operationId: listEvents
      summary: List events
      description: One page of events; q filters by text. Page size is capped at 500.
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 20 } }
      responses:
        '200':
          description: One page of events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
    post:
      operationId: createEvent
      summary: Create event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventInput' }
      responses:
        '400':
          description: startAt/endAt are not ISO-8601 timestamps, or endAt is not after startAt
        '201':
          description: Event created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
  /events/search:
    get:
      operationId: searchEvents
      summary: Search events
      description: Same as GET /events; q filters by text. Page size is capped at 500.
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 20 } }
      responses:
        '200':
          description: One page of matching events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
  /events/saved:
    get:
      operationId: listSavedEvents
      summary: List saved events
      description: >-
        Events the caller has RSVPed to (going, interested, maybe) or saved, soonest first, at most 200.
        Requires sign-in.
      responses:
        '401':
          description: Sign-in required
        '200':
          description: Saved events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
  /events/mine:
    get:
      operationId: listMyEvents
      summary: List my events
      responses:
        '200':
          description: My events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
  /events/{eventId}:
    get:
      operationId: getEvent
      summary: Get event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
  /events/{eventId}/attendance:
    get:
      operationId: listEventAttendance
      summary: List event attendance
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Event attendance
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventAttendance' }
    post:
      operationId: createEventAttendance
      summary: Create event attendance
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventAttendanceInput' }
      responses:
        '400':
          description: Status is not one of going, interested, maybe, saved, not_going
        '201':
          description: Attendance created (status stored lowercase)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventAttendance' }
  /events/categories:
    get:
      operationId: listEventCategories
      summary: List event categories
      responses:
        '200':
          description: Event categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventCategory' }
  /admin/automations:
    get:
      operationId: listAutomationOperations
      summary: List automation operations
      description: Requires the trusted SUPER_ADMIN role from JWT app_metadata unless the temporary public admin override is enabled.
      responses:
        '200':
          description: Available automation operations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AutomationOperation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/automations/{operationId}/executions:
    post:
      operationId: executeAutomation
      summary: Execute automation
      description: Dispatches an allow-listed workflow. High-impact operations require confirmation. Requires SUPER_ADMIN unless the temporary public admin override is enabled.
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteAutomationInput' }
      responses:
        '202':
          description: Automation dispatch accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationExecution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Explicit confirmation is required }
        '503': { description: Automation provider is not configured }
  /expenses/groups:
    get:
      operationId: listExpenseGroups
      summary: List expense groups
      description: Groups the caller owns or belongs to, with member count and total spend.
      responses:
        '200':
          description: Expense groups
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ExpenseGroup' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createExpenseGroup
      summary: Create expense group
      description: Creates a group owned by the caller; the caller becomes its first member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: string, maxLength: 4000 }
                groupType: { type: string, enum: [APARTMENT, TRIP, CARPOOL, EVENT] }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
      responses:
        '201':
          description: Created group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseGroup' }
  /expenses/groups/{groupId}/members:
    get:
      operationId: listExpenseGroupMembers
      summary: List expense group members
      description: Members only. User ids of the group's members, oldest first.
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Member ids, content: { application/json: { schema: { type: array, items: { type: string, format: uuid } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: addExpenseGroupMember
      summary: Add expense group member
      description: Owner only. Adds a member by user id; 404 when the id matches no account.
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [userId], properties: { userId: { type: string, format: uuid } } }
      responses:
        '200': { description: Member ids, content: { application/json: { schema: { type: array, items: { type: string, format: uuid } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /expenses/groups/{groupId}/members/{userId}:
    delete:
      operationId: removeExpenseGroupMember
      summary: Remove or leave an expense group
      description: >-
        The owner removes a member, or a member removes themselves. The owner cannot leave (409), and nobody with an
        open balance in the group can leave or be removed until it is settled (409).
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Membership removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'The owner tried to leave, or the member still has an open balance' }
  /expenses/groups/{groupId}/balances:
    get:
      operationId: listExpenseGroupBalances
      summary: List one group's balances
      description: Members only. Every open pairwise balance in the group after completed settlements.
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DebtBalance' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /expenses/groups/{groupId}/expenses:
    post:
      operationId: createExpense
      summary: Create expense
      description: >-
        Members only. The caller pays; the amount is split equally across members to the cent (splitType is stored
        but EXACT and PERCENTAGE are not applied yet).
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01, maximum: 99999999.99 }
                title: { type: string, maxLength: 150, description: Defaults to the description }
                description: { type: string, maxLength: 4000 }
                category: { type: string, maxLength: 50, description: Defaults to GENERAL }
                currency: { type: string, pattern: '^[A-Z]{3}$', description: 'Defaults to the group currency; any other currency is a 400' }
                splitType: { type: string, enum: [EQUAL, EXACT, PERCENTAGE], default: EQUAL }
                expenseDate: { type: string, format: date, description: 'Defaults to today; past dates are allowed' }
      responses:
        '201':
          description: Recorded expense
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { description: 'Validation failed, or the currency is not the group currency' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not a member of the group }
        '404': { description: Expense group not found }
  /expenses/balances:
    get:
      operationId: listExpenseBalances
      summary: List expense balances
      description: Net amounts the caller owes or is owed, per group and counterpart, after completed settlements.
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DebtBalance' } }
  /expenses/groups/{groupId}/settlements:
    get:
      operationId: listGroupSettlements
      summary: List one group's settlements
      description: Members (or the owner, or an admin) only. Every settlement recorded in the group, newest first.
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Settlements
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Settlement' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not a member of the group }
        '404': { description: Expense group not found }
    post:
      operationId: createSettlement
      summary: Create settlement
      description: >-
        Records a payment between two members; the caller must be one of them. The server sets the status and
        settledAt: the payer's record is pending until the recipient confirms it; a recipient (or admin) may record
        a received payment as completed. Only one pending record per payer, recipient and group.
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toUserId, amount]
              properties:
                fromUserId: { type: string, format: uuid, description: Defaults to the caller }
                toUserId: { type: string, format: uuid }
                amount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01, maximum: 99999999.99 }
                currency: { type: string, pattern: '^[A-Z]{3}$', description: 'Defaults to the group currency; any other currency is a 400' }
                status:
                  type: string
                  enum: [pending, completed]
                  description: A request; completed is honoured only for the recipient or an admin
      responses:
        '201':
          description: Recorded settlement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '400': { description: 'Validation failed, parties are not both group members, or the currency is not the group currency' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A pending record between these members already exists }
  /expenses/settlements/{settlementId}:
    patch:
      operationId: updateSettlementStatus
      summary: Confirm or cancel a settlement
      description: >-
        pending → completed by the recipient or an admin (settledAt is set by the server); pending → cancelled by
        either party. Completed and cancelled are final.
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, completed, cancelled] }
      responses:
        '200':
          description: Updated settlement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Transition not allowed }
  /posts/communities/{communityId}/join:
    post:
      operationId: joinCommunity
      summary: Join community
      parameters:
        - { name: communityId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Joined (idempotent) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /posts/communities/{communityId}/leave:
    post:
      operationId: leaveCommunity
      summary: Leave community
      parameters:
        - { name: communityId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Left (idempotent) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/export:
    get:
      operationId: exportMyData
      summary: Download everything stored against the caller
      description: JSON with one array per table of the caller's own rows (at most 1000 rows per table).
      responses:
        '200': { description: 'The export ({userId, exportedAt, data})' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /media/upload-url:
    post:
      operationId: createUploadUrl
      summary: Get a signed URL to upload one file to storage
      description: >-
        The server picks the object key (<userId>/<uuid>.<ext>). Images (JPEG, PNG, WebP, HEIC, GIF) up to 5 MB in
        avatars, rooms, rides, posts, marketplace and community; PDFs up to 10 MB only in documents. Upload the file
        with PUT to uploadUrl within 15 minutes, then use publicUrl (for example as a listing image).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucket, contentType, size]
              properties:
                bucket: { type: string, enum: [avatars, rooms, rides, posts, marketplace, community, documents] }
                contentType: { type: string, example: image/jpeg }
                size: { type: integer, minimum: 1, description: Bytes }
      responses:
        '200':
          description: Upload ticket
          content:
            application/json:
              schema:
                type: object
                required: [uploadUrl, bucket, path, publicUrl, contentType, maxBytes]
                properties:
                  uploadUrl: { type: string }
                  bucket: { type: string }
                  path: { type: string }
                  publicUrl: { type: string }
                  contentType: { type: string }
                  maxBytes: { type: integer }
        '400': { description: 'Unknown bucket, unsupported type, or too large' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: Storage provider unavailable }
        '503': { description: Storage is not configured }
  /media/delete:
    post:
      operationId: deleteUpload
      summary: Delete one of the caller's uploaded files
      description: POST with a body so object paths stay out of URLs. Paths outside the caller's folder read as 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucket, path]
              properties:
                bucket: { type: string }
                path: { type: string }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not one of the caller's files }
  /referrals/public:
    get:
      operationId: listPublicReferrals
      summary: List public referrals
      description: Newest 100 open (pending, open, active) referrals without contact details or owner ids. Public.
      security: []
      responses:
        '200':
          description: Referrals (contactInfo and ownerId are always null)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReferralView' }
  /referrals/offer:
    post:
      operationId: createReferralOffer
      summary: Create referral offer
      description: >-
        Creates an "offer" referral owned by the caller (status pending) together with its offer details
        (serviceType, availability, terms, expiresAt).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReferralOfferInput' }
      responses:
        '201':
          description: Created referral (the caller's own, so ownerId and contactInfo are included)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referral' }
        '400': { description: Validation failed }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /referrals/{referralId}/request:
    get:
      operationId: getReferralRequestDetails
      summary: Get referral request details
      description: >-
        Open referrals are visible to every signed-in member; closed ones only to the owner, the recipient and
        admins (404 otherwise).
      parameters:
        - { name: referralId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Request details }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not found or not visible to the caller }
  /referrals/{referralId}/offer:
    get:
      operationId: getReferralOfferDetails
      summary: Get referral offer details
      description: Same visibility rule as the request details.
      parameters:
        - { name: referralId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Offer details }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not found or not visible to the caller }
  /referrals/{referralId}/contact:
    post:
      operationId: contactReferralOwner
      summary: Message the poster of an open referral
      description: >-
        In one transaction: checks the referral is open and not the caller's own, reuses the newest direct chat in
        which exactly the caller and the poster are active participants (or creates one), adds both, sends the
        message, and notifies the poster. Returns the conversation id.
      parameters:
        - { name: referralId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message: { type: string, minLength: 20, maxLength: 2000 }
      responses:
        '200':
          description: The conversation the message was sent in
          content:
            application/json:
              schema:
                type: object
                required: [conversationId]
                properties:
                  conversationId: { type: string, format: uuid }
        '400': { description: 'Message shorter than 20 characters, or the caller owns the referral' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not found or closed (hidden from the caller) }
  /jobs/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateJobPosting
      summary: Edit a job posting
      description: >-
        Owner or admin only (enforced in JobPostingService). A null or absent field keeps its value; a blank
        optional text field (company, location, employmentType, applicationUrl) clears it; a blank title or
        description is 400. clearSalary empties both salary bounds before salaryMin/salaryMax apply. Status is
        open or closed (case-insensitive, stored lowercase).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateJobPostingInput' }
      responses:
        '200': { description: 'The updated posting. Job postings never include ownerId; mine is true for the owner.' }
        '400': { description: 'Invalid status, blank required field, or salaryMax below salaryMin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not the owner or an admin }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteJobPosting
      summary: Delete a job posting
      description: Owner or admin only. Applications are deleted with it.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not the owner or an admin }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/settings:
    get:
      operationId: getNotificationSettings
      summary: Get notification settings
      description: >-
        The caller's notification settings (defaults merged with saved values): boolean channel and category
        toggles plus quietHours (boolean), quietStart/quietEnd ("HH:mm") and timeZone (IANA).
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateNotificationSettings
      summary: Update notification settings
      description: >-
        Merges known keys into the caller's own settings; unknown keys are ignored. A known key with the wrong type
        or format is a 400, so nothing is silently dropped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettings' }
      responses:
        '200':
          description: The merged settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '400': { description: A known key has an invalid value }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /immigration/resources/{resourceId}:
    get:
      operationId: getImmigrationResource
      summary: Get immigration resource
      description: >-
        Public. Verified resources are visible to everyone; an unreviewed one only to its submitter and admins (404
        otherwise). The submitter id is never returned; `mine` marks the caller's own.
      security: []
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resource
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImmigrationResourceView' }
        '404': { description: Not found or not visible to the caller }
  /admin/users:
    get:
      operationId: listAdminUsers
      summary: List admin users
      description: ADMIN or SUPER_ADMIN. Newest 200 accounts from Supabase Auth.
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminRequired' }
        '503': { description: User directory is not available }
  /admin/users/{id}:
    get:
      operationId: getAdminUser
      summary: Get admin user
      description: ADMIN or SUPER_ADMIN. One account from Supabase Auth.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: User directory is not available }
  /admin/users/{id}/status:
    patch:
      operationId: updateAdminUserStatus
      summary: Update admin user status
      description: >-
        Suspends (bans) or reactivates an account through the Supabase Auth admin API. Requires a real signed-in
        admin (never the public demo override). Nobody can change their own status, super admin accounts cannot be
        changed here, and only a super admin can change another admin. Audited.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [Active, Suspended] } } }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { description: Status is not Active or Suspended (case-insensitive) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Not an admin, own account, a super admin target, or an admin target changed by a plain admin' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/rooms:
    get:
      operationId: listAdminRooms
      summary: List admin rooms
      description: ADMIN or SUPER_ADMIN. Newest 200 room listings.
      responses:
        '200':
          description: Newest 200 rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminRoom' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminRequired' }
  /admin/jobs:
    get:
      operationId: listAdminJobs
      summary: List admin jobs
      description: ADMIN or SUPER_ADMIN. Newest 200 job postings.
      responses:
        '200':
          description: Newest 200 rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminRequired' }
  /admin/events:
    get:
      operationId: listAdminEvents
      summary: List admin events
      description: ADMIN or SUPER_ADMIN. Newest 200 events.
      responses:
        '200':
          description: Newest 200 rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminRequired' }
  /admin/community:
    get:
      operationId: listAdminCommunityPosts
      summary: List admin community posts
      description: ADMIN or SUPER_ADMIN. Newest 200 community posts.
      responses:
        '200':
          description: Newest 200 rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminCommunityPost' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminRequired' }
  /admin/audit-log:
    get:
      operationId: listAdminAuditLog
      summary: List admin audit log
      description: ADMIN or SUPER_ADMIN. Newest 200 privileged actions.
      responses:
        '200':
          description: Newest 200 rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditLogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminRequired' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ExpenseGroup:
      type: object
      required: [id, name, groupType, currency, createdBy, createdAt, memberCount, totalExpenses]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        groupType: { type: string }
        currency: { type: string }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        memberCount: { type: integer }
        totalExpenses: { type: number }
    DebtBalance:
      type: object
      required: [groupId, groupName, fromUserId, toUserId, amount, currency]
      properties:
        groupId: { type: string, format: uuid }
        groupName: { type: string }
        fromUserId: { type: string, format: uuid }
        toUserId: { type: string, format: uuid }
        amount: { type: number }
        currency: { type: string }
    Expense:
      type: object
      additionalProperties: false
      required: [id, groupId, payerId, amount, currency, category, splitType, expenseDate, createdAt]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        payerId: { type: string, format: uuid }
        amount: { type: number }
        currency: { type: string }
        title: { type: [string, 'null'], maxLength: 150 }
        description: { type: [string, 'null'], maxLength: 4000 }
        category: { type: [string, 'null'], maxLength: 50 }
        splitType: { type: [string, 'null'], description: 'EQUAL, EXACT or PERCENTAGE' }
        expenseDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
    Settlement:
      type: object
      additionalProperties: false
      required: [id, groupId, fromUserId, toUserId, amount, currency, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        fromUserId: { type: string, format: uuid }
        toUserId: { type: string, format: uuid }
        amount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [pending, completed, cancelled] }
        settledAt: { type: [string, 'null'], format: date-time, description: Set by the server when completed }
        createdAt: { type: string, format: date-time }
    Health:
      type: object
      required: [status, service]
      properties:
        status: { type: string }
        service: { type: string }
    Identity:
      type: object
      additionalProperties: false
      required: [id, email, fullName, role]
      properties:
        id: { type: string, description: JWT subject (Supabase user UUID) }
        email: { type: [string, 'null'], format: email, description: Verified email from the JWT }
        fullName: { type: [string, 'null'], description: Display name from user_metadata }
        role: { type: string, description: Primary role from trusted app_metadata; defaults to user }
    WelcomeFlow:
      type: object
      additionalProperties: false
      required: [splash, steps]
      properties:
        splash:
          $ref: '#/components/schemas/SplashContent'
        steps:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/WelcomeStep'
    SplashContent:
      type: object
      additionalProperties: false
      required: [brand, tagline, logoUrl]
      properties:
        brand: { type: string, minLength: 1 }
        tagline: { type: string, minLength: 1 }
        logoUrl: { type: string, format: uri }
    WelcomeStep:
      type: object
      additionalProperties: false
      required: [id, title, body, imageUrl, actionLabel]
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
        imageUrl: { type: string, format: uri }
        actionLabel: { type: string, minLength: 1 }
        secondaryActionLabel: { type: string }
    NotificationInbox:
      type: object
      required: [items, page, hasMore, unreadCount]
      properties:
        page: { type: integer }
        hasMore: { type: boolean }
        unreadCount: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationInboxItem' }
    NotificationInboxItem:
      type: object
      required: [id, title, body, meta, read, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        meta: { type: string, description: 'Notification type, e.g. RIDE or CHAT' }
        read: { type: boolean }
        route: { type: [string, 'null'], description: 'In-app route to open, when the notification has one' }
        createdAt: { type: string, format: date-time }
    CatalogScreenContent:
      type: object
      additionalProperties: false
      required: [title, subtitle, eyebrow, metrics, items]
      properties:
        title: { type: string, minLength: 1 }
        subtitle: { type: string, minLength: 1 }
        eyebrow: { type: string, minLength: 1 }
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/CatalogMetric'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
    CatalogMetric:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label: { type: string, minLength: 1 }
        value: { type: string, minLength: 1 }
    CatalogItem:
      type: object
      additionalProperties: false
      required: [id, title, body]
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
        meta: { type: string }
        route: { type: string }
        status: { type: string }
    CreatePostInput:
      type: object
      additionalProperties: false
      required: [communityId, title, body]
      properties:
        communityId: { type: string, format: uuid, description: The community to post in; the caller must have joined it }
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, minLength: 1, maxLength: 4000 }
    CommunityPost:
      allOf:
        - $ref: '#/components/schemas/CreatePostInput'
        - type: object
          required: [id, ownerId, createdAt]
          properties:
            id: { type: string, format: uuid }
            ownerId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    ImmigrationResource:
      type: object
      additionalProperties: false
      required: [id, ownerId, title, description, category, resourceType, verified, createdAt]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        category: { type: string, maxLength: 80 }
        url: { type: string, format: uri, maxLength: 500 }
        resourceType: { type: string, enum: [DOCUMENT, GUIDE, LINK, FORM, TEMPLATE] }
        tags: { type: string, maxLength: 400 }
        verified: { type: boolean }
        createdAt: { type: string, format: date-time }
    ImmigrationResourceView:
      type: object
      additionalProperties: false
      description: A resource as shown to readers. The submitter's user id is never returned; `mine` is true for the caller's own submission.
      required: [id, title, description, category, url, resourceType, tags, verified, mine, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        category: { type: string, maxLength: 80 }
        url: { type: [string, 'null'], format: uri, maxLength: 500 }
        resourceType: { type: string, enum: [DOCUMENT, GUIDE, LINK, FORM, TEMPLATE] }
        tags: { type: [string, 'null'], maxLength: 400 }
        verified: { type: boolean }
        mine: { type: boolean }
        createdAt: { type: string, format: date-time }
    CreateImmigrationResourceInput:
      type: object
      additionalProperties: false
      required: [title, description, category, resourceType]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        category: { type: string, maxLength: 80 }
        url: { type: string, format: uri, maxLength: 500 }
        resourceType: { type: string, enum: [DOCUMENT, GUIDE, LINK, FORM, TEMPLATE] }
        tags: { type: string, maxLength: 400 }
        verified: { type: boolean }
    ImmigrationGuide:
      type: object
      additionalProperties: false
      required: [id, ownerId, title, description, content, category, difficultyLevel, estimatedDurationMinutes, createdAt]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        content: { type: string, maxLength: 4000 }
        category: { type: string, maxLength: 80 }
        difficultyLevel: { type: string, enum: [BEGINNER, INTERMEDIATE, ADVANCED] }
        estimatedDurationMinutes: { type: integer }
        createdAt: { type: string, format: date-time }
    ImmigrationChecklist:
      type: object
      additionalProperties: false
      required: [id, ownerId, title, description, category, itemsJson, createdAt]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        category: { type: string, maxLength: 80 }
        itemsJson: { type: string, maxLength: 4000 }
        dueDate: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ImmigrationNews:
      type: object
      additionalProperties: false
      required: [id, title, body, category, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 300 }
        body: { type: string, maxLength: 4000 }
        source: { type: string, maxLength: 200 }
        url: { type: string, format: uri, maxLength: 500 }
        category: { type: string, maxLength: 80 }
        publishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    FaqItem:
      type: object
