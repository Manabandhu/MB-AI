      summary: List automation operations
      description: Requires the trusted SUPER_ADMIN role from JWT app_metadata unless the temporary public admin override is enabled.
      responses:
        '200':
          description: Available automation operations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AutomationOperation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/automations/{operationId}/executions:
    post:
      operationId: executeAutomation
      summary: Execute automation
      description: Dispatches an allow-listed workflow. High-impact operations require confirmation. Requires SUPER_ADMIN unless the temporary public admin override is enabled.
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteAutomationInput' }
      responses:
        '202':
          description: Automation dispatch accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationExecution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Explicit confirmation is required }
        '503': { description: Automation provider is not configured }
  /expenses/groups:
    get:
      operationId: listExpenseGroups
      summary: List expense groups
      description: Groups the caller owns or belongs to, with member count and total spend.
      responses:
        '200':
          description: Expense groups
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ExpenseGroup' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createExpenseGroup
      summary: Create expense group
      description: Creates a group owned by the caller; the caller becomes its first member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: string, maxLength: 4000 }
                groupType: { type: string, enum: [APARTMENT, TRIP, CARPOOL, EVENT] }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
      responses:
        '201':
          description: Created group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseGroup' }
  /expenses/groups/{groupId}/members:
    post:
      operationId: addExpenseGroupMember
      summary: Add expense group member
      description: Owner only. Adds a member by user id.
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [userId], properties: { userId: { type: string, format: uuid } } }
      responses:
        '200': { description: Member ids, content: { application/json: { schema: { type: array, items: { type: string, format: uuid } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /expenses/groups/{groupId}/expenses:
    post:
      operationId: createExpense
      summary: Create expense
      description: Members only. The caller pays; the amount is split equally across members to the cent.
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 0.01 }
                title: { type: string, maxLength: 150 }
                category: { type: string }
                currency: { type: string, description: Defaults to the group currency }
                expenseDate: { type: string, format: date, description: Defaults to today }
      responses:
        '201': { description: Recorded expense }
        '403': { $ref: '#/components/responses/Forbidden' }
  /expenses/balances:
    get:
      operationId: listExpenseBalances
      summary: List expense balances
      description: Net amounts the caller owes or is owed, per group and counterpart, after completed settlements.
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DebtBalance' } }
  /expenses/groups/{groupId}/settlements:
    post:
      operationId: createSettlement
      summary: Create settlement
      description: >-
        Records a payment between two members; the caller must be one of them. The server sets the status and
        settledAt: the payer's record is pending until the recipient confirms it; a recipient (or admin) may record
        a received payment as completed. Only one pending record per payer, recipient and group.
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toUserId, amount]
              properties:
                fromUserId: { type: string, format: uuid, description: Defaults to the caller }
                toUserId: { type: string, format: uuid }
                amount: { type: number, minimum: 0.01 }
                status:
                  type: string
                  enum: [pending, completed]
                  description: A request; completed is honoured only for the recipient or an admin
      responses:
        '201': { description: Recorded settlement }
        '400': { description: Parties are not both group members }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A pending record between these members already exists }
  /expenses/settlements/{settlementId}:
    patch:
      operationId: updateSettlementStatus
      summary: Confirm or cancel a settlement
      description: >-
        pending → completed by the recipient or an admin (settledAt is set by the server); pending → cancelled by
        either party. Completed and cancelled are final.
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, completed, cancelled] }
      responses:
        '200': { description: Updated settlement }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Transition not allowed }
