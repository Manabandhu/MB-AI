        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createRoomBooking
      summary: Request a booking
      description: Any signed-in user except the owner, on an active listing, with no other pending request for it.
