openapi: 3.1.0
info:
  title: ManaBandhu REST API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /foundation/welcome:
    get:
      operationId: getWelcomeFlow
      security: []
      responses:
        '200':
          description: Splash and welcome flow content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WelcomeFlow'
  /foundation/screens/{screenId}:
    get:
      operationId: getFoundationScreenContent
      security: []
      parameters:
        - name: screenId
          in: path
          required: true
          schema:
            type: string
            enum: [onboarding, explore, search, saved, profile, settings]
      responses:
        '200':
          description: Public foundation screen content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogScreenContent'
        '404': { description: Unknown screen }
  /notifications/inbox:
    get:
      operationId: getNotificationsInbox
      security: []
      responses:
        '200':
          description: Demo-safe in-app notification inbox content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogScreenContent'
  /rooms/screens/{screenId}:
    get:
      operationId: getRoomsScreenContent
      security: []
      parameters:
        - name: screenId
          in: path
          required: true
          schema:
            type: string
            enum: [home, search, map, filters, saved, my-listings, create-listing, details, edit]
      responses:
        '200':
          description: Demo-safe room discovery screen content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogScreenContent'
        '404': { description: Unknown screen }
  /rides/screens/{screenId}:
    get:
      operationId: getRidesScreenContent
      security: []
      parameters:
        - name: screenId
          in: path
          required: true
          schema:
            type: string
            enum: [home, search, map, filters, offer]
      responses:
        '200':
          description: Demo-safe ride discovery screen content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogScreenContent'
        '404': { description: Unknown screen }
  /posts:
    get:
      operationId: listCommunityPosts
      responses:
        '200':
          description: Community posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityPost'
    post:
      operationId: createCommunityPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostInput'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPost'
  /immigration/resources:
    get:
      operationId: listImmigrationResources
      responses:
        '200':
          description: Immigration resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImmigrationResource'
      parameters:
        - name: category
          in: query
          schema: { type: string }
    post:
      operationId: createImmigrationResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImmigrationResourceInput'
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImmigrationResource'
  /immigration/guides:
    get:
      operationId: listImmigrationGuides
      responses:
        '200':
          description: Immigration guides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImmigrationGuide'
      parameters:
        - name: category
          in: query
          schema: { type: string }
  /immigration/checklists:
    get:
      operationId: listImmigrationChecklists
      responses:
        '200':
          description: Immigration checklists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImmigrationChecklist'
      parameters:
        - name: category
          in: query
          schema: { type: string }
  /immigration/faq:
    get:
      operationId: listFaqItems
      responses:
        '200':
          description: FAQ items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FaqItem'
      parameters:
        - name: category
          in: query
          schema: { type: string }
  /immigration/news:
    get:
      operationId: listImmigrationNews
      responses:
        '200':
          description: Immigration news
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImmigrationNews'
  /safety/reports:
    get:
      operationId: listSafetyReports
      responses:
        '200':
          description: Safety reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SafetyReport'
    post:
      operationId: createSafetyReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSafetyReportInput'
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetyReport'
  /safety/reports/{id}/resolve:
    post:
      operationId: resolveSafetyReport
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Report resolved
  /safety/blocked-users:
    get:
      operationId: listBlockedUsers
      responses:
        '200':
          description: Blocked users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockedUser'
    post:
      operationId: blockUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockUserInput'
      responses:
        '201':
          description: User blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedUser'
  /safety/blocked-users/{blockedUserId}/unblock:
    post:
      operationId: unblockUser
      parameters:
        - name: blockedUserId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: User unblocked
  /safety/trusted-contacts:
    get:
      operationId: listTrustedContacts
      responses:
        '200':
          description: Trusted contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrustedContact'
    post:
      operationId: createTrustedContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrustedContactInput'
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedContact'
  /utilities/packages:
    get:
      operationId: listPackageTrackings
      responses:
        '200':
          description: Package trackings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PackageTracking'
    post:
      operationId: createPackageTracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePackageTrackingInput'
      responses:
        '201':
          description: Tracking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageTracking'
  /utilities/nearby:
    get:
      operationId: listNearbyPlaces
      responses:
        '200':
          description: Nearby places
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NearbyPlace'
      parameters:
        - name: category
          in: query
          schema: { type: string }
  /utilities/emergency:
    get:
      operationId: listEmergencyResources
      responses:
        '200':
          description: Emergency resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmergencyResource'
      parameters:
        - name: category
          in: query
          schema: { type: string }
  /notifications:
    get:
      operationId: listNotifications
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
    post:
      operationId: createNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'
      responses:
        '201':
          description: Notification created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      responses:
        '200':
          description: Unread notification count
          content:
            application/json:
              schema:
                type: integer
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Notification marked read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
  /notifications/preferences:
    get:
      operationId: listNotificationPreferences
      responses:
        '200':
          description: Notification preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreference'
    post:
      operationId: setNotificationPreference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPreferenceRequest'
      responses:
        '200':
          description: Preference updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
  /chat/conversations:
    get:
      operationId: listConversations
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
    post:
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationInput'
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
  /chat/conversations/{id}:
    get:
      operationId: getConversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
  /chat/conversations/{id}/messages:
    get:
      operationId: listMessages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
    post:
      operationId: sendMessage
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageInput'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /chat/conversations/{id}/participants:
    get:
      operationId: listParticipants
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationParticipant'
    post:
      operationId: addParticipant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddParticipantInput'
      responses:
        '201':
          description: Participant added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationParticipant'
  /assistant/conversations:
    get:
      operationId: listAssistantConversations
      responses:
        '200':
          description: Assistant conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssistantConversation'
    post:
      operationId: createAssistantConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantConversation'
  /assistant/conversations/{id}/messages:
    get:
      operationId: listAssistantMessages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Assistant messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssistantMessage'
    post:
      operationId: sendAssistantMessage
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAssistantMessageInput'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantMessage'
  /assistant/conversations/{id}/stream:
    get:
      operationId: streamAssistantMessages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Streaming assistant response
          content:
            text/event-stream:
              schema:
                type: string
  /assistant/messages/{id}/citations:
    get:
      operationId: listAssistantCitations
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Citations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssistantCitation'
    post:
      operationId: createAssistantCitation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssistantCitationInput'
      responses:
        '201':
          description: Citation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantCitation'
  /rooms:
    get:
      operationId: listRoomListings
      parameters:
        - name: location
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Room listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoomListing' }
    post:
      operationId: createRoomListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoomListingInput' }
      responses:
        '201':
          description: Listing created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomListing' }
  /rooms/saved:
    get:
      operationId: listSavedRoomListings
      responses:
        '200':
          description: Saved room listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoomListing' }
  /rooms/my-listings:
    get:
      operationId: listMyRoomListings
      responses:
        '200':
          description: My room listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoomListing' }
  /rooms/{roomId}:
    get:
      operationId: getRoomListing
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Room listing detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomListing' }
  /rooms/{roomId}/bookings:
    get:
      operationId: listRoomBookings
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Room bookings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoomBooking' }
    post:
      operationId: createRoomBooking
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoomBookingInput' }
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomBooking' }
  /rides:
    get:
      operationId: listRideOffers
      parameters:
        - name: origin
          in: query
          schema: { type: string }
        - name: destination
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Ride offers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RideOffer' }
    post:
      operationId: createRideOffer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRideOfferInput' }
      responses:
        '201':
          description: Ride offer created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOffer' }
  /rides/saved:
    get:
      operationId: listSavedRides
      responses:
        '200':
          description: Saved rides
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RideOffer' }
  /rides/mine:
    get:
      operationId: listMyRides
      responses:
        '200':
          description: My rides
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RideOffer' }
  /rides/history:
    get:
      operationId: listRideHistory
      responses:
        '200':
          description: Ride history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RideOffer' }
  /rides/{rideId}:
    get:
      operationId: getRideOffer
      parameters:
        - name: rideId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Ride offer detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOffer' }
  /rides/{rideId}/requests:
    get:
      operationId: listRideRequests
      parameters:
        - name: rideId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Ride requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RideRequest' }
    post:
      operationId: createRideRequest
      parameters:
        - name: rideId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRideRequestInput' }
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideRequest' }
  /rides/{rideId}/participants:
    get:
      operationId: listRideParticipants
      parameters:
        - name: rideId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Ride participants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RideParticipant' }
  /rides/{rideId}/rate:
    post:
      operationId: rateRide
      parameters:
        - name: rideId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRideRatingInput' }
      responses:
        '201':
          description: Rating created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideRating' }
  /rides/{rideId}/ratings:
    get:
      operationId: listRideRatings
      parameters:
        - name: rideId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Ride ratings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RideRating' }
  /posts/communities:
    get:
      operationId: listCommunities
      responses:
        '200':
          description: Communities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Community' }
    post:
      operationId: createCommunity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommunityInput' }
      responses:
        '201':
          description: Community created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Community' }
  /posts/{postId}/comments:
    get:
      operationId: listPostComments
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Post comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PostComment' }
    post:
      operationId: createPostComment
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostCommentInput' }
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostComment' }
  /posts/{postId}/reactions:
    get:
      operationId: listPostReactions
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Post reactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PostReaction' }
    post:
      operationId: createPostReaction
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostReactionInput' }
      responses:
        '201':
          description: Reaction created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostReaction' }
  /events:
    get:
      operationId: listEvents
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
    post:
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventInput' }
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
  /events/saved:
    get:
      operationId: listSavedEvents
      responses:
        '200':
          description: Saved events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
  /events/mine:
    get:
      operationId: listMyEvents
      responses:
        '200':
          description: My events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
  /events/{eventId}:
    get:
      operationId: getEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
  /events/{eventId}/attendance:
    get:
      operationId: listEventAttendance
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Event attendance
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventAttendance' }
    post:
      operationId: createEventAttendance
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventAttendanceInput' }
      responses:
        '201':
          description: Attendance created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventAttendance' }
  /events/categories:
    get:
      operationId: listEventCategories
      responses:
        '200':
          description: Event categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventCategory' }
  /admin/automations:
    get:
      operationId: listAutomationOperations
      description: Requires the trusted SUPER_ADMIN role from JWT app_metadata unless the temporary public admin override is enabled.
      responses:
        '200':
          description: Available automation operations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AutomationOperation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/automations/{operationId}/executions:
    post:
      operationId: executeAutomation
      description: Dispatches an allow-listed workflow. High-impact operations require confirmation. Requires SUPER_ADMIN unless the temporary public admin override is enabled.
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteAutomationInput' }
      responses:
        '202':
          description: Automation dispatch accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationExecution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Explicit confirmation is required }
        '503': { description: Automation provider is not configured }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
