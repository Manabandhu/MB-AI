openapi: 3.1.0
info:
  title: ManaBandhu REST API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /foundation/welcome:
    get:
      operationId: getWelcomeFlow
      security: []
      responses:
        '200':
          description: Splash and welcome flow content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WelcomeFlow'
  /foundation/screens/{screenId}:
    get:
      operationId: getFoundationScreenContent
      security: []
      parameters:
        - name: screenId
          in: path
          required: true
          schema:
            type: string
            enum: [onboarding, explore, search, saved, profile, settings]
      responses:
        '200':
          description: Public foundation screen content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogScreenContent'
        '404': { description: Unknown screen }
  /notifications/inbox:
    get:
      operationId: getNotificationsInbox
      security: []
      responses:
        '200':
          description: Demo-safe in-app notification inbox content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogScreenContent'
  /rooms/screens/{screenId}:
    get:
      operationId: getRoomsScreenContent
      security: []
      parameters:
        - name: screenId
          in: path
          required: true
          schema:
            type: string
            enum: [home, search, map, filters, saved, my-listings, create-listing, details, edit]
      responses:
        '200':
          description: Demo-safe room discovery screen content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogScreenContent'
        '404': { description: Unknown screen }
  /rides/screens/{screenId}:
    get:
      operationId: getRidesScreenContent
      security: []
      parameters:
        - name: screenId
          in: path
          required: true
          schema:
            type: string
            enum: [home, search, map, filters, offer]
      responses:
        '200':
          description: Demo-safe ride discovery screen content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogScreenContent'
        '404': { description: Unknown screen }
  /posts:
    get:
      operationId: listCommunityPosts
      responses:
        '200':
          description: Community posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityPost'
    post:
      operationId: createCommunityPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostInput'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPost'
  /admin/automations:
    get:
      operationId: listAutomationOperations
      description: Requires the trusted SUPER_ADMIN role from JWT app_metadata unless the temporary public admin override is enabled.
      responses:
        '200':
          description: Available automation operations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AutomationOperation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/automations/{operationId}/executions:
    post:
      operationId: executeAutomation
      description: Dispatches an allow-listed workflow. High-impact operations require confirmation. Requires SUPER_ADMIN unless the temporary public admin override is enabled.
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteAutomationInput' }
      responses:
        '202':
          description: Automation dispatch accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationExecution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Explicit confirmation is required }
        '503': { description: Automation provider is not configured }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, service]
      properties:
        status: { type: string }
        service: { type: string }
    WelcomeFlow:
      type: object
      additionalProperties: false
      required: [splash, steps]
      properties:
        splash:
          $ref: '#/components/schemas/SplashContent'
        steps:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/WelcomeStep'
    SplashContent:
      type: object
      additionalProperties: false
      required: [brand, tagline, logoUrl]
      properties:
        brand: { type: string, minLength: 1 }
        tagline: { type: string, minLength: 1 }
        logoUrl: { type: string, format: uri }
    WelcomeStep:
      type: object
      additionalProperties: false
      required: [id, title, body, imageUrl, actionLabel]
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
        imageUrl: { type: string, format: uri }
        actionLabel: { type: string, minLength: 1 }
        secondaryActionLabel: { type: string }
    CatalogScreenContent:
      type: object
      additionalProperties: false
      required: [title, subtitle, eyebrow, metrics, items]
      properties:
        title: { type: string, minLength: 1 }
        subtitle: { type: string, minLength: 1 }
        eyebrow: { type: string, minLength: 1 }
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/CatalogMetric'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
    CatalogMetric:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label: { type: string, minLength: 1 }
        value: { type: string, minLength: 1 }
    CatalogItem:
      type: object
      additionalProperties: false
      required: [id, title, body]
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
        meta: { type: string }
        route: { type: string }
        status: { type: string }
    CreatePostInput:
      type: object
      additionalProperties: false
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, minLength: 1, maxLength: 4000 }
    CommunityPost:
      allOf:
        - $ref: '#/components/schemas/CreatePostInput'
        - type: object
          required: [id, ownerId, createdAt]
          properties:
            id: { type: string, format: uuid }
            ownerId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    AutomationOperation:
      type: object
      additionalProperties: false
      required: [id, label, description, category, risk, requiresConfirmation, configured]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        category: { type: string }
        risk: { type: string, enum: [low, medium, high, critical] }
        requiresConfirmation: { type: boolean }
        configured: { type: boolean }
    ExecuteAutomationInput:
      type: object
      additionalProperties: false
      required: [environment, ref, reason, confirmed]
      properties:
        environment: { type: string, enum: [development, staging, production] }
        ref: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 10, maxLength: 500 }
        confirmed: { type: boolean }
    AutomationExecution:
      type: object
      additionalProperties: false
      required: [executionId, operationId, status, environment, ref, requestedAt]
      properties:
        executionId: { type: string, format: uuid }
        operationId: { type: string }
        status: { type: string, enum: [accepted] }
        environment: { type: string }
        ref: { type: string }
        requestedAt: { type: string, format: date-time }
  responses:
    Unauthorized: { description: Authentication is required }
    Forbidden: { description: SUPER_ADMIN role is required }
security:
  - bearerAuth: []
