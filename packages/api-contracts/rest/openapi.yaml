      description: Google Directions proxy (key stays server-side). 503 when no key is configured.
      parameters:
        - { name: originLat, in: query, required: true, schema: { type: number } }
        - { name: originLng, in: query, required: true, schema: { type: number } }
        - { name: destinationLat, in: query, required: true, schema: { type: number } }
        - { name: destinationLng, in: query, required: true, schema: { type: number } }
        - { name: avoidTolls, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Route summary }
        '503': { description: Maps provider is not configured }
  /rides/maps/autocomplete:
    get:
      operationId: autocompletePlaces
      summary: Autocomplete places
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        '200': { description: Place predictions }
        '503': { description: Maps provider is not configured }
