      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { status: { type: string, enum: [pending, confirmed, cancelled] } } }
      responses:
        '200': { description: Updated booking }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Booking already cancelled }
  /rides/maps/route:
