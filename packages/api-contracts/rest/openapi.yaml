        id: { type: string, format: uuid }
        listingId: { type: string, format: uuid }
        url: { type: string, maxLength: 500 }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
    AddListingImageInput:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, minLength: 1, maxLength: 500, description: The owner's upload in the marketplace bucket }
        sortOrder: { type: integer, minimum: 0, maximum: 100, default: 0 }
    ListingFavorite:
      type: object
      additionalProperties: false
      required: [id, listingId, userId, createdAt]
      properties:
        id: { type: string, format: uuid }
        listingId: { type: string, format: uuid }
        userId: { type: string, format: uuid, description: The caller }
        createdAt: { type: string, format: date-time }
    ListingContactResponse:
      type: object
      additionalProperties: false
      required: [conversationId, created]
      properties:
        conversationId: { type: string, format: uuid }
        created: { type: boolean, description: False when the caller's existing chat about this listing was returned }
    CreateListingReportInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 4000 }
    ListingReportResponse:
      type: object
      additionalProperties: false
      required: [id, listingId, reason, status]
      properties:
        id: { type: string, format: uuid }
        listingId: { type: string, format: uuid }
        reason: { type: string, maxLength: 80 }
        status: { type: string, enum: [open] }
    Community:
      type: object
      additionalProperties: false
      required: [id, ownerId, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 4000 }
        createdAt: { type: string, format: date-time }
        slug: { type: [string, 'null'], maxLength: 150, description: 'Database-managed; null in the create response' }
        category: { type: [string, 'null'], maxLength: 50, description: 'Database-managed; null in the create response' }
        metroArea: { type: [string, 'null'], maxLength: 100 }
        memberCount: { type: integer, minimum: 0, description: 0 when not yet counted }
        avatarUrl: { type: [string, 'null'] }
        coverUrl: { type: [string, 'null'] }
    CommunityView:
      type: object
      additionalProperties: false
      description: Community card data plus whether the signed-in viewer has joined. Carries no owner id.
      required: [id, name, description, memberCount, category, image, isJoined, slug, metroArea]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000, description: Empty string when the community has none }
        memberCount: { type: integer, minimum: 0 }
        category: { type: string, maxLength: 50, description: Defaults to CITY }
        image: { type: [string, 'null'], description: 'Cover URL, else avatar URL' }
        isJoined: { type: boolean, description: False for anonymous viewers }
        slug: { type: [string, 'null'], maxLength: 150 }
        metroArea: { type: [string, 'null'], maxLength: 100 }
    CreateCommunityInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
    PostComment:
      type: object
      additionalProperties: false
      required: [id, postId, authorId, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        body: { type: string, maxLength: 4000 }
        createdAt: { type: string, format: date-time }
    CreatePostCommentInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, maxLength: 4000 }
    PostReaction:
      type: object
      additionalProperties: false
      required: [id, postId, userId, type, createdAt]
      properties:
        id: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type: { type: string, maxLength: 20 }
        createdAt: { type: string, format: date-time }
    CreatePostReactionInput:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [LIKE, HELPFUL, HEART], description: Case-insensitive; stored upper case }
    UpdateJobPostingInput:
      type: object
      additionalProperties: false
      properties:
        categoryId: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        company: { type: string, maxLength: 200, description: Blank clears }
        location: { type: string, maxLength: 200, description: Blank clears }
        description: { type: string, maxLength: 4000 }
        employmentType: { type: string, maxLength: 50, description: Blank clears }
        isRemote: { type: boolean }
        salaryMin: { type: integer, minimum: 0 }
        salaryMax: { type: integer, minimum: 0 }
        applicationUrl: { type: string, maxLength: 500, description: Blank clears }
        status: { type: string, enum: [open, closed, OPEN, CLOSED] }
        clearSalary: { type: boolean, description: Empties both salary bounds before salaryMin/salaryMax apply }
    ReactionCount:
      type: object
      additionalProperties: false
      required: [type, count]
      properties:
        type: { type: string, enum: [LIKE, HELPFUL, HEART] }
        count: { type: integer, format: int64, minimum: 1 }
    PostView:
      type: object
      additionalProperties: false
      description: Public; carries no user ids. `mine` is true when the signed-in viewer wrote the post.
      required: [id, authorName, mine, title, body, createdAt, commentCount, reactionCounts, reactionCount]
      properties:
        id: { type: string, format: uuid }
        communityId: { type: [string, 'null'], format: uuid }
        mine: { type: boolean }
        authorName: { type: string, maxLength: 40, description: 'Nickname, else first name, else "Member"' }
        title: { type: string, maxLength: 120 }
        body: { type: string, maxLength: 4000 }
        createdAt: { type: string, format: date-time }
        commentCount: { type: integer, format: int64, minimum: 0 }
        reactionCounts:
          type: object
          description: Count per reaction type (LIKE, HELPFUL, HEART); absent types are zero
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        reactionCount: { type: integer, format: int64, minimum: 0 }
        viewerReaction: { type: [string, 'null'], enum: [LIKE, HELPFUL, HEART, null] }
    CommentView:
      type: object
      additionalProperties: false
      description: Public; carries no user ids. `mine` is true when the signed-in viewer wrote the comment.
      required: [id, postId, authorName, mine, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        mine: { type: boolean }
        authorName: { type: string, maxLength: 40 }
        body: { type: string, maxLength: 4000 }
        createdAt: { type: string, format: date-time }
    EventPage:
      type: object
      additionalProperties: false
      description: >-
        Spring Data PagedModel (spring.data.web.pageable.serialization-mode via-dto). There is no last, first or
        numberOfElements; clients derive the last page as page.number + 1 >= page.totalPages.
      required: [content, page]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/Event' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    Event:
      type: object
      additionalProperties: false
      description: >-
        Event reads are public, so the organizer's user id is never returned; mine is true when the signed-in
        caller organizes the event (false for other callers and anonymous viewers).
      required: [id, mine, title, location, startAt, endAt, categoryId, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        mine: { type: boolean }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        location: { type: string, maxLength: 200 }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        categoryId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, PUBLISHED, CANCELED, COMPLETED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateEventInput:
      type: object
      additionalProperties: false
      required: [title, location, startAt, endAt, categoryId]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        location: { type: string, maxLength: 200 }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        categoryId: { type: string, format: uuid }
    CreateEventAttendanceInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [going, interested, maybe, saved, not_going]
          description: Matched case-insensitively (GOING is accepted) and stored lowercase
    EventAttendance:
      type: object
      additionalProperties: false
      required: [id, eventId, userId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        status:
          type: string
          description: 'Lowercase: going, interested, maybe, saved, not_going (rows written before 2026-10 may be uppercase)'
        createdAt: { type: string, format: date-time }
    EventCategory:
      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 4000 }
        createdAt: { type: string, format: date-time }
  responses:
    Unauthorized: { description: Authentication is required }
    Forbidden: { description: SUPER_ADMIN role is required }
    AdminRequired: { description: ADMIN or SUPER_ADMIN role is required }
    BadRequest: { description: 'Validation failed or a service rule rejected a value (ApiError problem+json body)' }
    NotOwner:
      description: The caller does not own the resource and is not an admin
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ModeratorRequired:
      description: Admin (moderator) access is required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ChatParticipantsOnly:
      description: The caller is not an active participant of the conversation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: The resource does not exist or is not visible to the caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InvalidTransition:
      description: The status change is not allowed from the current status
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RideMembersOnly:
      description: Only the ride's driver, its passengers (live booking or accepted request), and admins may do this
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    MapsRateLimited:
      description: The caller used its 60 map lookups for this minute
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    MapsProviderUnavailable:
      description: Google Maps failed or returned nothing
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    MapsNotConfigured:
      description: No Maps server key is configured; clients fall back to their own estimators
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  parameters:
    RoomListingId:
      name: listingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RideOfferId:
      name: offerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RideId:
      name: rideId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MarketplaceListingId:
      name: listingId
      in: path
      required: true
      schema: { type: string, format: uuid }
security:
  - bearerAuth: []
