        name: { type: string, maxLength: 200 }
        category: { type: string, maxLength: 80 }
        address: { type: string, maxLength: 400 }
        phone: { type: string, maxLength: 20 }
        hours: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 4000 }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
    Notification:
      type: object
      additionalProperties: false
      required: [id, userId, title, body, type, read, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 4000 }
        type: { type: string, enum: [SYSTEM, COMMUNITY, SAFETY, RIDE, ROOM, CHAT, AI, EXPENSE, REFERRAL, EVENT, JOB] }
        read: { type: boolean }
        readAt: { type: [string, 'null'], format: date-time }
        actionRoute: { type: [string, 'null'], maxLength: 200 }
        createdAt: { type: string, format: date-time }
        dispatched: { type: boolean, description: Push delivery bookkeeping (serialized from the entity) }
        dispatchedAt: { type: [string, 'null'], format: date-time, description: Push delivery bookkeeping }
        dispatchAttempts: { type: integer, minimum: 0, description: Push delivery bookkeeping }
    ReferralView:
      type: object
      additionalProperties: false
      description: >-
        A referral as shown to a viewer. contactInfo is included only for the owner and admins; the public list
        never carries contactInfo or ownerId (both null).
      required: [id, ownerId, type, status, title, description, category, contactInfo, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: [string, 'null'], format: uuid }
        type: { type: string, maxLength: 10, example: offer }
        status: { type: string, maxLength: 20 }
        title: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 4000 }
        category: { type: [string, 'null'], maxLength: 100 }
        contactInfo: { type: [string, 'null'], maxLength: 200 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Referral:
      type: object
      additionalProperties: false
      description: The referral entity, returned to its owner on create.
      required: [id, ownerId, type, status, title, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        recipientId: { type: [string, 'null'], format: uuid }
        type: { type: string, maxLength: 10 }
        status: { type: string, maxLength: 20 }
        title: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 4000 }
        category: { type: [string, 'null'], maxLength: 100 }
        contactInfo: { type: [string, 'null'], maxLength: 200 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateReferralOfferInput:
      type: object
      required: [title, serviceType]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        serviceType: { type: string, minLength: 1, maxLength: 100 }
        availability: { type: string, maxLength: 4000 }
        terms: { type: string, maxLength: 4000 }
        expiresAt: { type: string, format: date-time }
    NotificationSettings:
      type: object
      additionalProperties: false
      required: [preferences]
      properties:
        preferences:
          type: object
          description: >-
            Responses carry every key (defaults merged with saved values). In a PATCH, unknown keys and null values
            are ignored; a known key with the wrong type or format is a 400.
          properties:
            allNotifications: { type: boolean, default: true }
            inApp: { type: boolean, default: true }
            push: { type: boolean, default: true }
            email: { type: boolean, default: true }
            sms: { type: boolean, default: false }
            housingAlerts: { type: boolean, default: true }
            rideAlerts: { type: boolean, default: true }
            jobAlerts: { type: boolean, default: true }
            referralAlerts: { type: boolean, default: true }
            communityEvents: { type: boolean, default: true }
            chatMessages: { type: boolean, default: true }
            expenseAlerts: { type: boolean, default: true }
            safetyAlerts: { type: boolean, default: true }
            quietHours: { type: boolean, default: false }
            quietStart: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', default: '22:00' }
            quietEnd: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', default: '07:00' }
            timeZone: { type: string, description: IANA time zone, default: UTC }
    CreateNotificationRequest:
      type: object
      additionalProperties: false
      required: [title, body, type]
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 4000 }
        type: { type: string, enum: [SYSTEM, COMMUNITY, SAFETY, RIDE, ROOM, CHAT, AI] }
        actionRoute: { type: string, maxLength: 200 }
    Conversation:
      type: object
      additionalProperties: false
      required: [id, type, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [DIRECT, GROUP, ROOM_INQUIRY, RIDE_TEMP] }
        title: { type: [string, 'null'], maxLength: 200 }
        createdAt: { type: string, format: date-time }
        lastMessageAt: { type: [string, 'null'], format: date-time }
        lastMessage: { type: [string, 'null'], description: Body of the latest message }
        unreadCount:
          type: [integer, 'null']
          minimum: 0
          description: >-
            Messages from other people sent after the caller's read marker (or after they joined, before their first
            read). Null only for an admin viewing a conversation they are not a member of.
    MarkConversationReadInput:
      type: object
      additionalProperties: false
      properties:
        messageId:
          type: [string, 'null']
          format: uuid
          description: Mark read up to this message (must belong to the conversation); omit to mark everything read
    ConversationReadState:
      type: object
      additionalProperties: false
      required: [conversationId, lastReadAt, unreadCount]
      properties:
        conversationId: { type: string, format: uuid }
        lastReadAt: { type: string, format: date-time }
        unreadCount: { type: integer, minimum: 0 }
    CreateConversationInput:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [DIRECT, GROUP] }
        title: { type: string, maxLength: 200 }
    Message:
      type: object
      additionalProperties: false
      required: [id, conversationId, senderId, body, messageType, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        body: { type: string, maxLength: 4000 }
        messageType: { type: string, enum: [TEXT, IMAGE, SYSTEM] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SendMessageInput:
      type: object
      additionalProperties: false
      required: [body, messageType]
      properties:
        body: { type: string, maxLength: 4000 }
        messageType: { type: string, enum: [TEXT, IMAGE, SYSTEM] }
    ConversationParticipant:
      type: object
      additionalProperties: false
      required: [id, conversationId, userId, role, joinedAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        joinedAt: { type: string, format: date-time }
        leftAt: { type: string, format: date-time }
        role: { type: string, enum: [OWNER, MEMBER] }
    AddParticipantInput:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
    AssistantConversation:
      type: object
      additionalProperties: false
      required: [id, userId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateConversationRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
    AssistantMessage:
      type: object
      additionalProperties: false
      required: [id, conversationId, role, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        role: { type: string, enum: [USER, ASSISTANT, SYSTEM] }
        content: { type: string, maxLength: 4000 }
        createdAt: { type: string, format: date-time }
    SendAssistantMessageInput:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, maxLength: 4000 }
    AssistantCitation:
      type: object
      additionalProperties: false
      required: [id, messageId, title, snippet, createdAt]
      properties:
        id: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        title: { type: string, maxLength: 300 }
        url: { type: string, format: uri, maxLength: 500 }
        snippet: { type: string, maxLength: 4000 }
        createdAt: { type: string, format: date-time }
    AutomationOperation:
      type: object
      additionalProperties: false
      required: [id, label, description, category, risk, requiresConfirmation, configured]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        category: { type: string }
        risk: { type: string, enum: [low, medium, high, critical] }
        requiresConfirmation: { type: boolean }
        configured: { type: boolean }
    ExecuteAutomationInput:
      type: object
      additionalProperties: false
      required: [environment, ref, reason, confirmed]
      properties:
        environment: { type: string, enum: [development, staging, production] }
        ref: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 10, maxLength: 500 }
        confirmed: { type: boolean }
    AutomationExecution:
      type: object
      additionalProperties: false
      required: [executionId, operationId, status, environment, ref, acceptedAt]
      properties:
        executionId: { type: string, format: uuid }
        operationId: { type: string }
        status: { type: string, enum: [accepted] }
        environment: { type: string }
        ref: { type: string }
        acceptedAt: { type: string, format: date-time }
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, name, email, role, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: 'full_name from user metadata, else an em dash' }
        email: { type: [string, 'null'] }
        role: { type: string, description: 'Highest role from app_metadata.roles (super_admin, admin, else the first role, default user)' }
        status: { type: string, enum: [Active, Suspended] }
        createdAt: { type: [string, 'null'], format: date-time }
    AdminRoom:
      type: object
      additionalProperties: false
      required: [id, title, hostName, status, reported, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: [string, 'null'] }
        hostName: { type: string, description: 'Pseudonymous label ("Member (<first 8 id chars>)") or Unknown; never a user id' }
        status: { type: [string, 'null'] }
        reported: { type: boolean, description: True when the listing has an open or in-review report }
        createdAt: { type: [string, 'null'], format: date-time }
    AdminJob:
      type: object
      additionalProperties: false
      required: [id, title, company, status, reported, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: [string, 'null'] }
        company: { type: [string, 'null'] }
        status: { type: [string, 'null'] }
        reported: { type: boolean, description: Always false (job reports are not tracked yet) }
        createdAt: { type: [string, 'null'], format: date-time }
    AdminEvent:
      type: object
      additionalProperties: false
      required: [id, title, organizer, date, status, reported, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: [string, 'null'] }
        organizer: { type: string, description: 'Pseudonymous label ("Member (<first 8 id chars>)") or Unknown' }
        date: { type: [string, 'null'], format: date-time, description: Event start }
        status: { type: [string, 'null'] }
        reported: { type: boolean, description: Always false (event reports are not tracked yet) }
        createdAt: { type: [string, 'null'], format: date-time }
    AdminCommunityPost:
      type: object
      additionalProperties: false
      required: [id, communityName, authorName, title, status, reported, createdAt]
      properties:
        id: { type: string, format: uuid }
        communityName: { type: string, description: General when the post has no community }
        authorName: { type: string, description: 'Pseudonymous label ("Member (<first 8 id chars>)") or Unknown' }
        title: { type: [string, 'null'] }
        status: { type: string, enum: [published] }
        reported: { type: boolean, description: Always false (post reports are not tracked yet) }
        createdAt: { type: [string, 'null'], format: date-time }
    AuditLogEntry:
      type: object
      additionalProperties: false
      required: [id, actor, action, targetType, targetId, createdAt]
      properties:
        id: { type: string, format: uuid }
        actor: { type: string, description: 'Actor user id, or public-demo' }
        action: { type: string, example: user.suspended }
        targetType: { type: [string, 'null'] }
        targetId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    RoomListingStatus:
      type: string
      description: Stored lowercase. Only active and paused listings are public.
      enum: [draft, active, paused, archived, rejected, rented]
    RoomBookingStatus:
      type: string
      enum: [pending, accepted, rejected, cancelled]
    RoomReportStatus:
      type: string
      enum: [open, in_review, resolved, dismissed]
    RoomDietaryPreference:
      type: string
      enum: [ANY, PURE_VEG, VEG_PREFERRED, VEG_FRIENDLY, NON_VEG_ALLOWED]
    RoomGenderPreference:
      type: string
      enum: [ANY, MALE_ONLY, FEMALE_ONLY]
    RoomBathroomType:
      type: string
      enum: [SHARED, PRIVATE_DEDICATED, PRIVATE_ATTACHED]
    RoomLeaseTerm:
      type: string
      enum: [FLEXIBLE, SHORT_TERM, LONG_TERM, SUBLEASE, MONTH_TO_MONTH, SIX_MONTHS, ONE_YEAR]
    ApiError:
      type: object
      description: >-
        Every error response (service rules, bean validation, malformed requests) is RFC 9457 problem+json that also
        carries `error` and `message` with the same human-readable text as `detail`. 5xx bodies never include
        exception messages, SQL, or class names.
      required: [error, message]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        error: { type: string }
        message: { type: string }
    RoomListing:
      type: object
      additionalProperties: false
      description: >-
        Public listing response. Never carries the owner's user id or the exact address, and latitude/longitude are
        rounded to 2 decimals (about 1 km). isOwner tells the client whether to show owner actions; the owner reads
        exact values through OwnerRoomListing.
      required: [id, title, description, price, roomType, status, broadLocation, latitude, longitude, createdAt, updatedAt, amenities, preferences, savedByViewer, isOwner, coverImageUrl, dietaryPreference, genderPreference, bathroomType, utilitiesIncluded, estUtilityMonthly, securityDeposit, leaseTerm, isVerifiedHost, universityShuttleAccessible, stateCode, county]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 4000 }
        price: { type: number }
        roomType: { type: string, maxLength: 50, description: Free text }
        status: { $ref: '#/components/schemas/RoomListingStatus' }
        broadLocation: { type: [string, 'null'], maxLength: 200 }
        latitude: { type: [number, 'null'], description: Rounded to 2 decimals }
        longitude: { type: [number, 'null'], description: Rounded to 2 decimals }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        amenities: { type: array, items: { type: string } }
        preferences: { type: array, items: { type: string } }
        savedByViewer: { type: boolean, description: False for anonymous viewers }
        isOwner: { type: boolean, description: True when the viewer owns the listing }
        coverImageUrl: { type: [string, 'null'], description: URL of the first image by sortOrder }
        dietaryPreference: { anyOf: [{ $ref: '#/components/schemas/RoomDietaryPreference' }, { type: 'null' }] }
        genderPreference: { anyOf: [{ $ref: '#/components/schemas/RoomGenderPreference' }, { type: 'null' }] }
        bathroomType: { anyOf: [{ $ref: '#/components/schemas/RoomBathroomType' }, { type: 'null' }] }
        utilitiesIncluded: { type: [boolean, 'null'] }
        estUtilityMonthly: { type: [number, 'null'] }
        securityDeposit: { type: [number, 'null'] }
        leaseTerm: { anyOf: [{ $ref: '#/components/schemas/RoomLeaseTerm' }, { type: 'null' }] }
        isVerifiedHost: { type: [boolean, 'null'] }
        universityShuttleAccessible: { type: [boolean, 'null'] }
        stateCode: { type: [string, 'null'], maxLength: 50 }
        county: { type: [string, 'null'], maxLength: 100 }
    PageMetadata:
      type: object
      additionalProperties: false
      description: Page counters of a Spring Data PagedModel response.
      required: [size, number, totalElements, totalPages]
      properties:
        size: { type: integer, description: Requested page size }
        number: { type: integer, description: Zero-based page index }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    RoomListingPage:
      type: object
      additionalProperties: false
      description: >-
        Spring Data PagedModel (spring.data.web.pageable.serialization-mode via-dto). There is no last, first or
        numberOfElements; clients derive the last page as page.number + 1 >= page.totalPages.
      required: [content, page]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/RoomListing' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    OwnerRoomListing:
      type: object
      additionalProperties: false
      description: Owner-facing listing response with the owner id, exact address and exact coordinates. Returned only to the owner or an admin.
      required: [id, ownerId, title, description, price, roomType, status, broadLocation, exactAddress, latitude, longitude, createdAt, updatedAt, amenities, preferences, coverImageUrl, dietaryPreference, genderPreference, bathroomType, utilitiesIncluded, estUtilityMonthly, securityDeposit, leaseTerm, isVerifiedHost, universityShuttleAccessible, stateCode, county]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 4000 }
        price: { type: number }
        roomType: { type: string, maxLength: 50, description: Free text }
        status: { $ref: '#/components/schemas/RoomListingStatus' }
        broadLocation: { type: [string, 'null'], maxLength: 200 }
        exactAddress: { type: [string, 'null'], maxLength: 4000 }
        latitude: { type: [number, 'null'], description: Exact latitude }
        longitude: { type: [number, 'null'], description: Exact longitude }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        amenities: { type: array, items: { type: string } }
        preferences: { type: array, items: { type: string } }
        coverImageUrl: { type: [string, 'null'], description: URL of the first image by sortOrder }
        dietaryPreference: { anyOf: [{ $ref: '#/components/schemas/RoomDietaryPreference' }, { type: 'null' }] }
        genderPreference: { anyOf: [{ $ref: '#/components/schemas/RoomGenderPreference' }, { type: 'null' }] }
        bathroomType: { anyOf: [{ $ref: '#/components/schemas/RoomBathroomType' }, { type: 'null' }] }
        utilitiesIncluded: { type: [boolean, 'null'] }
        estUtilityMonthly: { type: [number, 'null'] }
        securityDeposit: { type: [number, 'null'] }
        leaseTerm: { anyOf: [{ $ref: '#/components/schemas/RoomLeaseTerm' }, { type: 'null' }] }
        isVerifiedHost: { type: [boolean, 'null'] }
        universityShuttleAccessible: { type: [boolean, 'null'] }
        stateCode: { type: [string, 'null'], maxLength: 50 }
        county: { type: [string, 'null'], maxLength: 100 }
    CreateRoomListingInput:
      type: object
      additionalProperties: false
      description: Omitted preference fields take their defaults (ANY, ANY, SHARED, FLEXIBLE, false, 0).
      required: [title, price, roomType]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: Must not be blank }
        description: { type: string, maxLength: 4000 }
        price: { type: number, exclusiveMinimum: 0, maximum: 99999999.99, description: At most 2 decimals }
        roomType: { type: string, minLength: 1, maxLength: 50, description: Free text; must not be blank }
        broadLocation: { type: string, maxLength: 200 }
        exactAddress: { type: string, maxLength: 4000 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        dietaryPreference: { $ref: '#/components/schemas/RoomDietaryPreference' }
        genderPreference: { $ref: '#/components/schemas/RoomGenderPreference' }
        bathroomType: { $ref: '#/components/schemas/RoomBathroomType' }
        utilitiesIncluded: { type: boolean }
        estUtilityMonthly: { type: number, minimum: 0, maximum: 99999999.99 }
        securityDeposit: { type: number, minimum: 0, maximum: 99999999.99 }
        leaseTerm: { $ref: '#/components/schemas/RoomLeaseTerm' }
        universityShuttleAccessible: { type: boolean }
        stateCode: { type: string, maxLength: 50 }
        county: { type: string, maxLength: 100 }
        amenities:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 80 }
    UpdateRoomListingInput:
      type: object
      additionalProperties: false
      description: >-
        Partial update. Null or omitted fields are left unchanged; amenities replaces the whole set when present. A
        status change must follow the transition rules (owner draft to active or archived, active to paused, archived
        or rented, paused to active, archived or rented, rented to active or archived; admins may also reject an active
        listing and move a rejected one to active or draft), otherwise 409.
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: Must not be blank when present }
        description: { type: string, maxLength: 4000 }
        price: { type: number, exclusiveMinimum: 0, maximum: 99999999.99, description: At most 2 decimals }
        roomType: { type: string, minLength: 1, maxLength: 50, description: Free text; must not be blank when present }
        broadLocation: { type: string, maxLength: 200 }
        exactAddress: { type: string, maxLength: 4000 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        status: { $ref: '#/components/schemas/RoomListingStatus' }
        dietaryPreference: { $ref: '#/components/schemas/RoomDietaryPreference' }
        genderPreference: { $ref: '#/components/schemas/RoomGenderPreference' }
        bathroomType: { $ref: '#/components/schemas/RoomBathroomType' }
        utilitiesIncluded: { type: boolean }
        estUtilityMonthly: { type: number, minimum: 0, maximum: 99999999.99 }
        securityDeposit: { type: number, minimum: 0, maximum: 99999999.99 }
        leaseTerm: { $ref: '#/components/schemas/RoomLeaseTerm' }
        universityShuttleAccessible: { type: boolean }
        stateCode: { type: string, maxLength: 50 }
        county: { type: string, maxLength: 100 }
        amenities:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 80 }
    RoomAmenityCatalogEntry:
      type: object
      additionalProperties: false
      required: [id, code, label, category, iconName, active, sortOrder]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 50 }
        label: { type: string, maxLength: 100 }
        category: { type: string, maxLength: 50 }
        iconName: { type: [string, 'null'], maxLength: 50 }
        active: { type: boolean }
        sortOrder: { type: integer }
    RoomImage:
      type: object
      additionalProperties: false
      required: [id, listingId, url, sortOrder, createdAt]
      properties:
        id: { type: string, format: uuid }
