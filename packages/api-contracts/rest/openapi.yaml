      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        trackingNumber: { type: string, maxLength: 80 }
        carrier: { type: string, maxLength: 80 }
        status: { type: string, enum: [PENDING, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, EXCEPTION] }
        estimatedDelivery: { type: string, format: date-time }
        lastUpdate: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    CreatePackageTrackingInput:
      type: object
      additionalProperties: false
      required: [trackingNumber, carrier, status]
      properties:
        trackingNumber: { type: string, maxLength: 80 }
        carrier: { type: string, maxLength: 80 }
        status: { type: string, enum: [PENDING, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, EXCEPTION] }
        estimatedDelivery: { type: string, format: date-time }
    NearbyPlace:
      type: object
      additionalProperties: false
      required: [id, name, category, address, latitude, longitude, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        category: { type: string, maxLength: 80 }
        address: { type: string, maxLength: 400 }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        rating: { type: number, format: double }
        distanceKm: { type: number, format: double }
        phone: { type: string, maxLength: 20 }
        createdAt: { type: string, format: date-time }
    EmergencyResource:
      type: object
      additionalProperties: false
      required: [id, name, category, address, description, latitude, longitude, createdAt]
      properties:
        id: { type: string, format: uuid }
