name: release-mobile
on:
  workflow_dispatch:
    inputs:
      environment: { description: Release channel, required: true, type: environment }
      reason: { description: Operator reason, required: true, type: string }
      actor_id: { description: Requesting user, required: true, type: string }
      execution_id: { description: Audit correlation ID, required: true, type: string }
# Least privilege: these jobs only read the repository; providers authenticate with environment secrets.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.21.0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manabandhu/frontend typecheck
      - name: Build with EAS
        # Profiles live in frontend/eas.json (development, staging, production) and match the release environments.
        working-directory: frontend
        run: pnpm dlx eas-cli@27.2.0 build --platform all --profile "$ENVIRONMENT" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
