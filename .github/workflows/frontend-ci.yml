name: CI · Frontend

on:
  pull_request:
    paths:
      - frontend/**
      - packages/design-system/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - biome.json
      - .github/workflows/frontend-ci.yml
  push:
    branches: [main]
    paths:
      - frontend/**
      - packages/design-system/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - biome.json

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, and export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting, lint, and types
        run: pnpm lint
      - name: Run frontend tests
        run: pnpm --filter @manabandhu/frontend test
      - name: Export responsive web application
        run: pnpm --filter @manabandhu/frontend exec expo export --platform web
        # The export validates public runtime config. This build is only verified, never deployed, so it uses
        # inert placeholders; deploy-web reads real values from the target environment's variables.
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8080
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-web-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
