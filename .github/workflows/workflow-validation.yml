name: CI · Workflow Validation

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/dependabot.yml

permissions:
  contents: read

jobs:
  yaml:
    name: Parse GitHub automation YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false
      - name: Validate GitHub Actions semantics
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.9 -color
      - name: Parse dependency configuration
        run: ruby -e "require 'yaml'; YAML.load_file('.github/dependabot.yml'); puts 'validated .github/dependabot.yml'"
