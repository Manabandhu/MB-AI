name: CI · Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Module skills and repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SKILL_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify module skills
        run: node scripts/verify-module-skills.mjs
      - name: Audit skill updates by commit
        run: node scripts/review-skill-history.mjs
      - name: Verify API contract synchronization
        run: node scripts/verify-contracts.mjs
