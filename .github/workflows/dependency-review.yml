name: CI · Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # GitHub's dependency review needs the repository's dependency graph (Settings → Code security). When it is off,
      # fall back to auditing the pnpm lockfile at base and head so new vulnerable packages still fail the check.
      - name: Check dependency graph availability
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE: repos/${{ github.repository }}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: |
          if gh api "$COMPARE" --silent 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Dependency graph disabled::Enable it at https://github.com/${{ github.repository }}/settings/security_analysis to get GitHub's full dependency review (npm and Maven). Using the pnpm lockfile audit instead."
          fi
      - name: Review dependency changes
        if: steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
      - name: Set up pnpm
        if: steps.graph.outputs.available != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - name: Set up Node.js
        if: steps.graph.outputs.available != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Audit for newly introduced vulnerable packages
        if: steps.graph.outputs.available != 'true'
        run: node scripts/audit-new-vulnerabilities.mjs ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
