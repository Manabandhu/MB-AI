name: rollback
on:
  workflow_dispatch:
    inputs:
      environment: { description: Target environment, required: true, type: environment }
      reason: { description: Operator reason, required: true, type: string }
      actor_id: { description: Requesting user, required: true, type: string }
      execution_id: { description: Audit correlation ID, required: true, type: string }
jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Roll back through configured provider
        run: test -n "$ROLLBACK_COMMAND" && sh -c "$ROLLBACK_COMMAND"
        env:
          ROLLBACK_COMMAND: ${{ secrets.ROLLBACK_COMMAND }}
