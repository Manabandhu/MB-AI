spring:
  application:
    name: manabandhu-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:30}
      minimum-idle: 5
      connection-timeout: 10000
      max-lifetime: 120000
      keepalive-time: 30000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}
  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI:https://lpzaioyurvgdysdfktzc.supabase.co/auth/v1/.well-known/jwks.json}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  admin:
    public-access-enabled: ${ADMIN_PUBLIC_ACCESS_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
  automation:
    github:
      repository: ${AUTOMATION_GITHUB_REPOSITORY:}
      token: ${AUTOMATION_GITHUB_TOKEN:}
  supabase:
    project-url: ${SUPABASE_PROJECT_URL:https://lpzaioyurvgdysdfktzc.supabase.co}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    jwt:
      issuer: ${SUPABASE_JWT_ISSUER:https://lpzaioyurvgdysdfktzc.supabase.co/auth/v1}
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
