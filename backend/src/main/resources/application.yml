spring:
  application:
    name: manabandhu-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 120000
      keepalive-time: 30000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}
    # The hosted database has a V29 applied outside this repository (load-test seed). Tolerate applied
    # migrations that have no local file instead of refusing to start; new migrations continue from V30.
    ignore-migration-patterns: "*:missing"
  data:
    web:
      pageable:
        # Bound every paged endpoint so a client cannot request an unbounded page.
        max-page-size: 500
        # Serialize Page<T> responses as Spring Data's stable PagedModel DTO:
        # { "content": [...], "page": { "size", "number", "totalElements", "totalPages" } }.
        serialization-mode: via-dto
  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI:https://lpzaioyurvgdysdfktzc.supabase.co/auth/v1/.well-known/jwks.json}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  notifications:
    # How often the dispatcher drains queued notifications.
    dispatch-interval-ms: ${NOTIFICATIONS_DISPATCH_INTERVAL_MS:60000}
    push:
      # Expo push delivery. Off by default so local runs and tests never call exp.host; set true where deployed.
      enabled: ${PUSH_NOTIFICATIONS_ENABLED:false}
      # Optional: required only when "enhanced push security" is on in the Expo project.
      expo-access-token: ${EXPO_ACCESS_TOKEN:}
  admin:
    public-access-enabled: ${ADMIN_PUBLIC_ACCESS_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
    # Local-network development origins. Set CORS_ALLOWED_ORIGIN_PATTERNS to an empty value in production.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*:[*],http://10.*:[*],http://172.16.*:[*],http://*.local:[*],exp://*}
  maps:
    # Google web-service key (Directions, Places, Geocoding). Server-side only; never ship it in the app.
    google-server-key: ${GOOGLE_MAPS_SERVER_KEY:}
  automation:
    github:
      repository: ${AUTOMATION_GITHUB_REPOSITORY:}
      token: ${AUTOMATION_GITHUB_TOKEN:}
  supabase:
    project-url: ${SUPABASE_PROJECT_URL:https://lpzaioyurvgdysdfktzc.supabase.co}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    jwt:
      issuer: ${SUPABASE_JWT_ISSUER:https://lpzaioyurvgdysdfktzc.supabase.co/auth/v1}
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
